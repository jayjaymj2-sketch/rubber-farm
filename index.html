  const k = curFarm + '|' + key;
  if (_cache.has(k)) return _cache.get(k);
  const v = fn();
  if (_cache.size > 1200) _cache.clear();
  _cache.set(k, v);
  return v;
}
// ทุกการเขียนข้อมูลผ่าน store → ล้างแคช
(function hookStore() {
  const put = store.putRecs.bind(store), clr = store.clearAll.bind(store), la = store.loadAll.bind(store);
  store.putRecs = (c, recs) => { bumpData(); return put(c, recs); };
  store.clearAll = () => { bumpData(); return clr(); };
  store.loadAll = async () => { const r = await la(); bumpData(); return r; };
})();
const _setFarm = v => { curFarm = v; };

/* ---------- ดัชนีตามวันที่ (ค้นช่วงวันแบบ binary search) ---------- */
const dkey = r => String(r.date || '');
function sortedByDate(coll) {
  return cached('sd:' + coll, () => {
    const a = [];
    for (const r of DB[coll].values()) if (!r.deleted) a.push(r);
    a.sort((x, y) => dkey(x).localeCompare(dkey(y)));
    return a;
  });
}
function lowerBound(arr, d) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (dkey(arr[m]) < d) lo = m + 1; else hi = m; } return lo; }
/** รายการในช่วงวันที่ (เร็วกว่าไล่ทั้งตาราง) */
function dateSlice(coll, from, to) {
  const a = sortedByDate(coll);
  const i = lowerBound(a, String(from)), j = lowerBound(a, String(to) + '￿');
  return a.slice(i, j);
}
/** แผนที่ id → farmId ของแต่ละตาราง */
function farmIndex(coll) {
  return cached('fi:' + coll, () => { const m = new Map(); for (const r of DB[coll].values()) m.set(r.id, farmOf(r)); return m; });
}
function rangeRows(coll, from, to, farm) {
  const rows = dateSlice(coll, from, to);
  if (farm === 'all' || !farm) return rows;
  const fi = farmIndex(coll);
  return rows.filter(r => fi.get(r.id) === farm);
}

/* ---------- saleCalc: จำผลด้วย WeakMap (ไม่มีวันค้าง) ---------- */
const _saleCalcRaw = saleCalc;
const _scMemo = new WeakMap();
saleCalc = function (r) {
  if (!r || typeof r !== 'object') return _saleCalcRaw(r);
  let v = _scMemo.get(r);
  if (v === undefined) { v = _saleCalcRaw(r); _scMemo.set(r, v); }
  return v;
};

/* ---------- pnl: ใช้ดัชนีแทนการไล่ทั้งฐานข้อมูล ---------- */
pnl = function (from, to, farm = curFarm) {
  return cached(`pnl:${from}:${to}:${farm}`, () => {
    const sales = rangeRows('sales', from, to, farm);
    const calc = sales.map(r => ({ r, c: saleCalc(r) }));
    const byProd = {};
    calc.forEach(({ r, c }) => { const p = byProd[r.product] || (byProd[r.product] = { kg: 0, dry: 0, gross: 0, net: 0, n: 0 }); p.kg += num(r.weight); p.dry += c.dryKg; p.gross += c.gross; p.net += c.net; p.n++; });
    const wl = rangeRows('worklogs', from, to, farm);
    const adj = rangeRows('payments', from, to, farm).filter(r => r.type === 'adjust');
    const ex = rangeRows('expenses', from, to, farm), inc = rangeRows('incomes', from, to, farm);
    const expByCat = {}; ex.forEach(r => expByCat[r.cat || 'อื่นๆ'] = (expByCat[r.cat || 'อื่นๆ'] || 0) + num(r.amount));
    const incByCat = {}; inc.forEach(r => incByCat[r.cat || 'อื่นๆ'] = (incByCat[r.cat || 'อื่นๆ'] || 0) + num(r.amount));
    const o = {
      salesN: sales.length, kg: r2(sum(sales, 'weight')), dryKg: r2(sum(calc, x => x.c.dryKg)),
      gross: r2(sum(calc, x => x.c.gross)), deduct: r2(sum(sales, 'deduct')), net: r2(sum(calc, x => x.c.net)),
      tapper: r2(sum(calc, x => x.c.tapperTotal)), ownerNet: r2(sum(calc, x => x.c.ownerNet)),
      wages: r2(sum(wl, wageAmt)), adjust: r2(sum(adj, 'amount')), expenses: r2(sum(ex, 'amount')), other: r2(sum(inc, 'amount')),
      byProd, expByCat, incByCat,
      tapDays: new Set(rangeRows('tapping', from, to, farm).filter(r => r.rain !== 'skip').map(r => r.date)).size,
    };
    o.labor = r2(o.tapper + o.wages + o.adjust);
    o.income = r2(o.net + o.other);
    o.cost = r2(o.labor + o.expenses);
    o.profit = r2(o.income - o.cost);
    return o;
  });
};

/* ---------- บัญชีคนงาน: คำนวณทุกคนพร้อมกันในรอบเดียว ---------- */
function allLedgers() {
  return cached('ledgers', () => {
    const M = new Map();
    const rowsOf = id => { let a = M.get(id); if (!a) M.set(id, a = []); return a; };
    for (const r of DB.sales.values()) {
      if (r.deleted || r.split !== 'share') continue;
      const ids = r.workerIds || []; if (!ids.length) continue;
      const c = saleCalc(r);
      ids.forEach(wid => rowsOf(wid).push({ date: r.date, kind: 'share', label: `ส่วนแบ่ง${PRODUCTS[r.product] || ''} ${fmt(r.weight)} กก.`, sub: `${fmt(100 - c.ownerPct)}% ของ ${baht(c.base)}${c.ids.length > 1 ? (c.custom ? ` · ได้ ${fmt(c.pctOf[wid])}%` : ` ÷ ${c.ids.length} คน`) : ''}`, amt: c.per[wid] ?? c.perTapper, coll: 'sales', id: r.id, t: r.createdAt }));
    }
    for (const r of DB.worklogs.values()) { if (r.deleted || !r.workerId) continue; rowsOf(r.workerId).push({ date: r.date, kind: 'wage', label: 'ค่าแรง: ' + (r.task || ''), sub: `${fmt(r.days)} วัน × ${baht(r.wage)}${r.plotId ? ' · ' + plotName(r.plotId) : ''}`, amt: wageAmt(r), coll: 'worklogs', id: r.id, t: r.createdAt }); }
    for (const r of DB.payments.values()) { if (r.deleted || !r.workerId) continue; rowsOf(r.workerId).push({ date: r.date, kind: r.type, label: PAYMENT_TYPES[r.type] || 'จ่ายเงิน', sub: [r.method, r.note].filter(Boolean).join(' · '), amt: r.type === 'adjust' ? num(r.amount) : -num(r.amount), coll: 'payments', id: r.id, t: r.createdAt }); }
    const out = new Map();
    for (const [wid, rows] of M) {
      rows.sort((a, b) => String(a.date).localeCompare(String(b.date)) || (a.t || 0) - (b.t || 0));
      let bal = 0; rows.forEach(x => { bal = r2(bal + x.amt); x.bal = bal; });
      out.set(wid, {
        rows,
        earned: r2(sum(rows.filter(x => ['share', 'wage', 'adjust'].includes(x.kind)), 'amt')),
        paid: r2(-sum(rows.filter(x => x.kind === 'pay' || x.kind === 'advance'), 'amt')),
        advance: r2(-sum(rows.filter(x => x.kind === 'advance'), 'amt')),
        balance: bal,
      });
    }
    return out;
  });
}
const EMPTY_LEDGER = { rows: [], earned: 0, paid: 0, advance: 0, balance: 0 };
workerLedger = function (wid) { return allLedgers().get(wid) || EMPTY_LEDGER; };

/* ---------- คงเหลือวัสดุ: รวมทุกชิ้นในรอบเดียว ---------- */
function allStock() {
  return cached('stock', () => {
    const m = new Map();
    for (const it of DB.items.values()) if (!it.deleted) m.set(it.id, num(it.initQty));
    const add = (id, q) => { if (id && m.has(id)) m.set(id, m.get(id) + q); };
    for (const r of DB.expenses.values()) if (!r.deleted) add(r.itemId, num(r.qty));
    for (const r of DB.stock.values()) if (!r.deleted) add(r.itemId, r.dir === 'out' ? -num(r.qty) : num(r.qty));
    for (const r of DB.activities.values()) if (!r.deleted) add(r.itemId, -num(r.qty));
    for (const [k, v] of m) m.set(k, r2(v));
    return m;
  });
}
itemStock = function (id) { const v = allStock().get(id); return v === undefined ? 0 : v; };

/* ---------- รายการล่าสุด (ใช้ในหน้าหลัก) ---------- */
function recentRecords(n = 6) {
  return cached('recent:' + n, () => {
    const out = [];
    for (const c of ['sales', 'expenses', 'tapping', 'worklogs']) {
      const fi = farmIndex(c);
      for (const r of DB[c].values()) {
        if (r.deleted) continue;
        if (curFarm !== 'all' && fi.get(r.id) !== curFarm) continue;
        out.push([c, r]);
      }
    }
    out.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    return out.slice(0, n);
  });
}

/* ---------- โหลดรูปเมื่อเลื่อนถึง (ประหยัดแรมและเน็ต) ---------- */
let _imgObs = null;
function imgObserver() {
  if (_imgObs || !('IntersectionObserver' in window)) return _imgObs;
  _imgObs = new IntersectionObserver(es => {
    es.forEach(async e => {
      if (!e.isIntersecting) return;
      const img = e.target; _imgObs.unobserve(img);
      if (img.dataset.done) return; img.dataset.done = 1;
      const src = await photoSrc(img.dataset.ref);
      if (src) img.src = src; else img.alt = '📷';
    });
  }, { rootMargin: '300px 0px' });
  return _imgObs;
}
hydratePhotos = function (root = document) {
  const obs = imgObserver();
  $$('img[data-ref]', root).forEach(img => {
    if (img.dataset.done || img.dataset.obs) return;
    if (!obs) { img.dataset.done = 1; photoSrc(img.dataset.ref).then(s => { if (s) img.src = s; else img.alt = '📷'; }); return; }
    img.dataset.obs = 1; img.loading = 'lazy'; obs.observe(img);
  });
};

/* ---------- รายการยาว: แสดงทีละชุด ---------- */
const PAGE_ROWS = 80;
function paginateLists(root) {
  $$('.list', root).forEach(box => {
    if (box.dataset.pg) return;
    const kids = [...box.children];
    if (kids.length <= PAGE_ROWS + 20) return;
    box.dataset.pg = 1;
    let shown = PAGE_ROWS;
    const btn = document.createElement('button');
    btn.className = 'btn more-btn';
    const apply = () => {
      kids.forEach((el, i) => { el.style.display = i < shown ? '' : 'none'; });
      const left = kids.length - shown;
      btn.textContent = left > 0 ? `แสดงเพิ่มอีก ${Math.min(PAGE_ROWS, left)} รายการ (เหลือ ${fmt(left, 0)})` : '';
      btn.style.display = left > 0 ? '' : 'none';
      if (left <= 0) return;
    };
    btn.onclick = () => { shown += PAGE_ROWS; apply(); hydratePhotos(box); };
    box.after(btn);
    apply();
  });
}

})();

/* หมวดต้นทุน: จัดกลุ่มรายจ่ายเป็นกลุ่มใหญ่ที่ชาวสวนเข้าใจ */
const COST_GROUPS = [
  ['แรงงาน', ['ค่าจ้างเหมา'], 'var(--violet)'],
  ['ปุ๋ย/บำรุงดิน', ['ปุ๋ย', 'ปุ๋ยคอก', 'วิเคราะห์ดิน'], 'var(--pri2)'],
  ['ยา/สารเคมี', ['ยากำจัดวัชพืช', 'ยา/สารป้องกันโรค', 'กรดฟอร์มิก/น้ำกรด'], 'var(--amber)'],
  ['อุปกรณ์กรีด', ['อุปกรณ์กรีด (ถ้วย ลวด ราง มีด)', 'ไฟฉาย/แบตเตอรี่', 'ซ่อมบำรุง/เครื่องมือ'], 'var(--blue)'],
  ['น้ำมัน/ขนส่ง', ['น้ำมันเชื้อเพลิง', 'ค่าขนส่ง'], 'var(--red)'],
  ['ปลูก/ขยายสวน', ['กล้ายาง/ปลูกซ่อม'], 'var(--pri)'],
  ['ภาษี/ค่าธรรมเนียม', ['ภาษีที่ดิน/ค่าธรรมเนียม'], 'var(--ink3)'],
];
function costGroupOf(cat) {
  for (const [g, cats] of COST_GROUPS) if (cats.includes(cat)) return g;
  return 'อื่นๆ';
}
const COST_GROUP_COLOR = Object.fromEntries([...COST_GROUPS.map(([g, , c]) => [g, c]), ['อื่นๆ', 'var(--ink3)']]);

/** สรุปต้นทุนต่อกิโลกรัมของยางที่ขายในช่วงเวลา */
function costPerKg(from, to, farm = curFarm) {
  return cached(`cpk:${from}:${to}:${farm}`, () => {
    const P = pnl(from, to, farm);
    const kg = P.kg, dry = P.dryKg;
    const parts = [];
    if (P.tapper) parts.push(['ส่วนแบ่งคนกรีด', P.tapper, 'var(--amber)', true]);
    if (P.wages + P.adjust) parts.push(['ค่าแรงรายวัน/โบนัส', r2(P.wages + P.adjust), 'var(--violet)', false]);
    const byG = {};
    Object.entries(P.expByCat).forEach(([cat, v]) => { const g = costGroupOf(cat); byG[g] = (byG[g] || 0) + v; });
    Object.entries(byG).sort((a, b) => b[1] - a[1]).forEach(([g, v]) => parts.push([g, r2(v), COST_GROUP_COLOR[g] || 'var(--ink3)', false]));
    const total = r2(sum(parts, x => x[1]));
    const fixed = r2(total - P.tapper);           // ต้นทุนที่ไม่ขึ้นกับราคายาง
    const avgPrice = kg ? r2(P.gross / kg) : 0;
    const sharePct = P.net ? r2(P.tapper * 100 / P.net) : 0;  // สัดส่วนที่คนกรีดได้จากยอดสุทธิ
    const ownerKeep = 1 - sharePct / 100;
    return {
      P, kg, dry, parts, total, fixed, avgPrice,
      perKg: kg ? r2(total / kg) : 0,
      fixedPerKg: kg ? r2(fixed / kg) : 0,
      marginPerKg: kg ? r2((P.income - total) / kg) : 0,
      sharePct, ownerKeep,
      // ราคาต่ำสุดที่ยังไม่ขาดทุน (คิดส่วนแบ่งคนกรีดตามสัดส่วนเดิม)
      breakEven: kg && ownerKeep > 0 ? r2(fixed / (kg * ownerKeep)) : 0,
      // กก. ขั้นต่ำที่ต้องขายที่ราคาปัจจุบันจึงจะเท่าทุน
      breakEvenKg: avgPrice && ownerKeep > 0 ? r2(fixed / (avgPrice * ownerKeep)) : 0,
    };
  });
}

/** สรุปรายแปลงในช่วงเวลา (รอบเดียวจบ ไม่ไล่ซ้ำทีละแปลง) */
function plotStatsRange(from, to, farm = curFarm) {
  return cached(`ps:${from}:${to}:${farm}`, () => {
    const plots = list('plots', p => (farm === 'all' || p.farmId === farm)).sort((a, b) => a.name.localeCompare(b.name, 'th'));
    const M = new Map(); const mk = id => { let x = M.get(id); if (!x) M.set(id, x = { kg: 0, dry: 0, gross: 0, net: 0, ownerNet: 0, tapper: 0, wages: 0, expenses: 0, other: 0, days: new Set(), salesN: 0 }); return x; };
    plots.forEach(p => mk(p.id));
    const un = mk('');
    for (const r of rangeRows('sales', from, to, farm)) { const x = mk(r.plotId || ''); const c = saleCalc(r); x.kg += num(r.weight); x.dry += c.dryKg; x.gross += c.gross; x.net += c.net; x.ownerNet += c.ownerNet; x.tapper += c.tapperTotal; x.salesN++; }
    for (const r of rangeRows('tapping', from, to, farm)) { if (r.rain === 'skip') continue; mk(r.plotId || '').days.add(r.date); }
    for (const r of rangeRows('worklogs', from, to, farm)) mk(r.plotId || '').wages += wageAmt(r);
    for (const r of rangeRows('payments', from, to, farm)) if (r.type === 'adjust') mk(r.plotId || '').wages += num(r.amount);
    for (const r of rangeRows('expenses', from, to, farm)) mk(r.plotId || '').expenses += num(r.amount);
    for (const r of rangeRows('incomes', from, to, farm)) mk(r.plotId || '').other += num(r.amount);
    const rows = plots.map(p => {
      const x = M.get(p.id), area = plotArea(p), trees = num(p.trees);
      const cost = r2(x.tapper + x.wages + x.expenses);   // ต้นทุนรวมส่วนแบ่งคนกรีด
      const income = r2(x.net + x.other);                  // รายรับก่อนแบ่ง (ให้ตรงกับงบรวม)
      return {
        p, area, trees, kg: r2(x.kg), dry: r2(x.dry), gross: r2(x.gross), days: x.days.size, salesN: x.salesN,
        tapper: r2(x.tapper), wages: r2(x.wages), expenses: r2(x.expenses), cost, income, profit: r2(income - cost),
        kgRai: area ? r2(x.kg / area) : 0, profitRai: area ? r2((income - cost) / area) : 0, costRai: area ? r2(cost / area) : 0,
        kgTree: trees ? r2(x.kg / trees) : 0,
        costKg: x.kg ? r2(cost / x.kg) : 0,
      };
    });
    const u = { kg: r2(un.kg), income: r2(un.net + un.other), cost: r2(un.tapper + un.wages + un.expenses) };
    return { rows, unassigned: u };
  });
}

/** สรุปคนงานในช่วงเวลา */
function workerStatsRange(from, to, farm = curFarm) {
  return cached(`ws:${from}:${to}:${farm}`, () => {
    const M = new Map(); const mk = id => { let x = M.get(id); if (!x) M.set(id, x = { kg: 0, share: 0, wage: 0, days: new Set(), sales: 0 }); return x; };
    for (const r of rangeRows('tapping', from, to, farm)) { if (r.rain === 'skip') continue; const ids = r.workerIds || []; ids.forEach(id => { const x = mk(id); x.days.add(r.date); x.kg += num(r.qty) / Math.max(1, ids.length); }); }
    for (const r of rangeRows('sales', from, to, farm)) { if (r.split !== 'share') continue; const c = saleCalc(r); (c.ids || []).forEach(id => { const x = mk(id); x.share += c.per[id] ?? c.perTapper; x.sales += num(r.weight) / Math.max(1, c.ids.length); }); }
    for (const r of rangeRows('worklogs', from, to, farm)) if (r.workerId) mk(r.workerId).wage += wageAmt(r);
    return [...M.entries()].map(([id, x]) => {
      const w = get('workers', id); if (!w) return null;
      const days = x.days.size;
      return { w, days, kg: r2(x.kg), sales: r2(x.sales), share: r2(x.share), wage: r2(x.wage), kgDay: days ? r2(x.kg / days) : 0, bahtDay: days ? r2((x.share + x.wage) / days) : 0, total: r2(x.share + x.wage) };
    }).filter(Boolean).sort((a, b) => b.total - a.total);
  });
}

const pctChange = (cur, prev) => !prev ? (cur ? 100 : 0) : r2((cur - prev) * 100 / Math.abs(prev));
const chgBadge = (cur, prev, goodUp = true) => {
  if (!prev) return '<span class="xs faint">—</span>';
  const p = pctChange(cur, prev), up = p > 0.5, dn = p < -0.5;
  const good = up ? goodUp : dn ? !goodUp : null;
  return `<span class="xs ${good === null ? 'faint' : good ? 'pos' : 'neg'}">${up ? '▲' : dn ? '▼' : '•'} ${fmt(Math.abs(p), 0)}%</span>`;
};

ROUTES.profit = {

      // เทียบช่วงก่อนหน้า

      const PV = prevRange ? pnl(prevRange[0], prevRange[1]) : null;
      const CV = prevRange ? costPerKg(prevRange[0], prevRange[1]) : null;

      const tabs = [['cost', 'ต้นทุน/จุดคุ้มทุน'], ['plots', 'รายแปลง'], ['people', 'คนงาน'], ['yoy', 'เทียบปีต่อปี'], ['what', 'ลองปรับราคา']];

      /* ---- ส่วนที่ 1: ต้นทุนต่อกิโล + จุดคุ้มทุน ---- */
      const costTab = () => {
        if (!C.kg) return emptyBox('ยังไม่มีการขายยางในช่วงนี้ ลองเปลี่ยนช่วงเวลาด้านบน', 'coins');
        const rows = C.parts.map(([l, v, c, isShare]) => [l, v, c, isShare]);
        return `
        <div class="grid2" style="margin-bottom:12px">
          ${kpi('ต้นทุนจริงต่อ กก.', fmt(C.perKg, 2) + ' บ.', `ขายได้เฉลี่ย ${fmt(C.avgPrice, 2)} บ./กก.`, 'calc', C.perKg > C.avgPrice ? 'neg' : '')}
          ${kpi('เหลือเป็นกำไรต่อ กก.', fmt(C.marginPerKg, 2) + ' บ.', C.avgPrice ? `คิดเป็น ${fmt(C.marginPerKg * 100 / C.avgPrice, 0)}% ของราคาขาย` : '', 'coins', C.marginPerKg < 0 ? 'neg' : 'pos')}
          ${kpi('ราคาต่ำสุดที่ไม่ขาดทุน', fmt(C.breakEven, 2) + ' บ./กก.', C.avgPrice ? (C.avgPrice > C.breakEven ? `สูงกว่าจุดคุ้มทุน ${fmt(C.avgPrice - C.breakEven, 2)} บ.` : `ต่ำกว่าจุดคุ้มทุน ${fmt(C.breakEven - C.avgPrice, 2)} บ.`) : '', 'target', C.avgPrice && C.avgPrice < C.breakEven ? 'neg' : 'pos')}
          ${kpi('ต้องขายอย่างน้อย', fmt(C.breakEvenKg, 0) + ' กก.', `ขายจริง ${fmt(C.kg, 0)} กก.`, 'scale', C.kg < C.breakEvenKg ? 'neg' : 'pos')}
        </div>
        <div class="card"><h3>${ic('receipt')} ต้นทุนแยกตามหมวด (ต่อกิโลกรัมที่ขายได้)</h3>
          <div class="tbl-wrap"><table class="tbl"><tr><th>หมวด</th><th class="n">รวม</th><th class="n">บ./กก.</th><th class="n">สัดส่วน</th></tr>
          ${rows.map(([l, v, c]) => `<tr><td><i class="dotc" style="background:${c}"></i>${esc(l)}</td><td class="n">${baht(v)}</td><td class="n tnum">${fmt(v / C.kg, 2)}</td><td class="n">${fmt(v * 100 / (C.total || 1), 0)}%</td></tr>`).join('')}
          <tr class="tot"><td>รวมต้นทุน</td><td class="n">${baht(C.total)}</td><td class="n tnum">${fmt(C.perKg, 2)}</td><td class="n">100%</td></tr>
          <tr class="tot"><td>ราคาขายเฉลี่ย</td><td class="n">${baht(P.gross)}</td><td class="n tnum">${fmt(C.avgPrice, 2)}</td><td class="n">-</td></tr>
          <tr class="tot"><td>กำไรต่อ กก.</td><td class="n ${C.marginPerKg < 0 ? 'neg' : 'pos'}">${baht(P.income - C.total)}</td><td class="n tnum ${C.marginPerKg < 0 ? 'neg' : 'pos'}">${fmt(C.marginPerKg, 2)}</td><td class="n">-</td></tr>
          </table></div>
          ${hbars(rows.map(([l, v, c]) => [l, v, c]), { color: 'var(--red)' })}
        </div>
        <div class="card"><h3>${ic('target')} จุดคุ้มทุน</h3>
          <p class="small">ต้นทุนที่ต้องจ่ายไม่ว่าราคายางจะเป็นเท่าไร (ค่าแรงรายวัน ปุ๋ย ยา น้ำมัน ฯลฯ) รวม <b>${baht(C.fixed)}</b> คิดเป็น <b>${fmt(C.fixedPerKg, 2)} บ./กก.</b>
          ${C.sharePct ? `<br>คนกรีดได้ส่วนแบ่ง ${fmt(C.sharePct, 0)}% ของยอดสุทธิ เจ้าของจึงเหลือ ${fmt(C.ownerKeep * 100, 0)}%` : ''}</p>
          <dl class="kv"><dt>ราคายางต่ำสุดที่ยังไม่ขาดทุน</dt><dd class="tnum"><b>${fmt(C.breakEven, 2)} บาท/กก.</b></dd>
          <dt>ปริมาณขั้นต่ำที่ราคาปัจจุบัน</dt><dd class="tnum">${fmt(C.breakEvenKg, 0)} กก.${areaAll ? ` (${fmt(C.breakEvenKg / areaAll, 0)} กก./ไร่)` : ''}</dd>
          ${areaAll ? `<dt>กำไรต่อไร่</dt><dd class="tnum ${P.profit < 0 ? 'neg' : 'pos'}">${baht(P.profit / areaAll)}</dd>` : ''}
          ${treesAll ? `<dt>กำไรต่อต้น</dt><dd class="tnum">${baht(P.profit / treesAll)}</dd>` : ''}
          ${areaAll ? `<dt>ผลผลิตต่อไร่</dt><dd class="tnum">${fmt(C.kg / areaAll, 0)} กก.</dd>` : ''}
          </dl>
          <div class="hint">จุดคุ้มทุนคำนวณจากต้นทุนจริงที่บันทึกไว้ในช่วงนี้ ยิ่งบันทึกครบ ตัวเลขยิ่งแม่น</div>
        </div>`;
      };

      /* ---- ส่วนที่ 2: รายแปลง ---- */
      const plotTab = () => {
        const rows = PS.rows.filter(x => x.kg || x.cost);
        if (!rows.length) return emptyBox('ยังไม่มีข้อมูลรายแปลงในช่วงนี้', 'leaf');
        // เฉลี่ยต้นทุนส่วนกลางตามพื้นที่
        const totArea = sum(rows, x => x.area);
        const shared = st.alloc ? PS.unassigned.cost : 0, sharedIn = st.alloc ? PS.unassigned.income : 0;
        const adj = rows.map(x => {
          const w = totArea ? x.area / totArea : 1 / rows.length;
          const cost = r2(x.cost + shared * w), income = r2(x.income + sharedIn * w);
          return { ...x, cost, income, profit: r2(income - cost), profitRai: x.area ? r2((income - cost) / x.area) : 0, costKg: x.kg ? r2(cost / x.kg) : 0 };
        }).sort((p, q) => q.profitRai - p.profitRai || q.profit - p.profit);
        const best = adj[0], worst = adj[adj.length - 1];
        return `
        <label class="switch small" style="margin-bottom:10px"><input type="checkbox" id="pAlloc"${st.alloc ? ' checked' : ''}> เฉลี่ยรายการที่ไม่ได้ระบุแปลงตามขนาดพื้นที่ ${PS.unassigned.cost || PS.unassigned.income ? `(ค่าใช้จ่าย ${bahtS(PS.unassigned.cost)} · รายรับ ${bahtS(PS.unassigned.income)})` : ''}</label>
        ${adj.length > 1 ? `<div class="grid2" style="margin-bottom:12px">
          ${kpi('แปลงที่คุ้มที่สุด', esc(best.p.name), `${baht(best.profitRai)}/ไร่ · ${fmt(best.kgRai, 0)} กก./ไร่`, 'medal', 'pos')}
          ${kpi('แปลงที่ควรดูแล', esc(worst.p.name), `${baht(worst.profitRai)}/ไร่ · ${fmt(worst.kgRai, 0)} กก./ไร่`, 'alert', worst.profitRai < 0 ? 'neg' : '')}
        </div>` : ''}
        <div class="card"><h3>${ic('leaf')} กำไรต่อไร่รายแปลง</h3>
        ${hbars(adj.map(x => [x.p.name, x.profitRai, x.profitRai < 0 ? 'var(--red)' : 'var(--pri2)']), { fmtV: v => baht(v) })}
        <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><tr><th>แปลง</th><th class="n">ไร่</th><th class="n">กก.</th><th class="n">กก./ไร่</th><th class="n">ต้นทุน/กก.</th><th class="n">กำไร</th><th class="n">กำไร/ไร่</th></tr>
        ${adj.map(x => `<tr><td><a href="#plot/${x.p.id}">${esc(x.p.name)}</a>${x.p.status === 'young' ? '<span class="xs faint"> (ยังไม่กรีด)</span>' : ''}</td><td class="n">${fmt(x.area, 1)}</td><td class="n">${fmt(x.kg, 0)}</td><td class="n">${x.area ? fmt(x.kgRai, 0) : '-'}</td><td class="n tnum">${x.kg ? fmt(x.costKg, 2) : '-'}</td><td class="n ${x.profit < 0 ? 'neg' : 'pos'}">${bahtS(x.profit)}</td><td class="n ${x.profitRai < 0 ? 'neg' : 'pos'}">${x.area ? bahtS(x.profitRai) : '-'}</td></tr>`).join('')}
        </table></div>
        <div class="hint">กำไรรายแปลง = ยอดขายสุทธิของแปลงนั้น ลบส่วนแบ่งคนกรีด ค่าแรง และค่าใช้จ่ายที่ผูกกับแปลง (วิธีเดียวกับงบกำไรขาดทุนรวม)</div></div>`;
      };

      /* ---- ส่วนที่ 3: คนงาน ---- */
      const peopleTab = () => {
        if (!WS.length) return emptyBox('ยังไม่มีข้อมูลคนงานในช่วงนี้', 'users');
        const byKg = [...WS].filter(x => x.days).sort((p, q) => q.kgDay - p.kgDay);
        return `
        <div class="card"><h3>${ic('medal')} ผลงานคนกรีด</h3>
        ${byKg.length ? hbars(byKg.map(x => [x.w.name, x.kgDay, 'var(--pri2)']), { fmtV: v => fmt(v, 1) + ' กก./วัน' }) : ''}
        <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><tr><th>คนงาน</th><th class="n">วันกรีด</th><th class="n">กก.รวม</th><th class="n">กก./วัน</th><th class="n">ส่วนแบ่ง</th><th class="n">ค่าแรง</th><th class="n">รายได้/วัน</th></tr>
        ${WS.map(x => `<tr><td><a href="#worker/${x.w.id}">${esc(x.w.name)}</a></td><td class="n">${x.days || '-'}</td><td class="n">${x.kg ? fmt(x.kg, 0) : '-'}</td><td class="n tnum">${x.kgDay ? fmt(x.kgDay, 1) : '-'}</td><td class="n">${bahtS(x.share)}</td><td class="n">${bahtS(x.wage)}</td><td class="n tnum">${x.bahtDay ? baht(x.bahtDay) : '-'}</td></tr>`).join('')}
        </table></div>
        <div class="hint">กก./วัน คำนวณจากน้ำหนักที่บันทึกตอนกรีด หารด้วยจำนวนวันที่คนนั้นออกกรีด (ถ้ากรีดหลายคนในวันเดียวจะหารเฉลี่ย)</div></div>
        <div class="card"><h3>${ic('wallet')} ต้นทุนแรงงานเทียบผลผลิต</h3>
        <dl class="kv"><dt>ค่าแรงรวม (ส่วนแบ่ง + รายวัน)</dt><dd>${baht(sum(WS, x => x.total))}</dd>
        <dt>คิดเป็นต่อกิโลที่ขาย</dt><dd class="tnum">${C.kg ? fmt(sum(WS, x => x.total) / C.kg, 2) + ' บ./กก.' : '-'}</dd>
        <dt>คิดเป็นสัดส่วนของรายรับ</dt><dd>${P.income ? fmt(sum(WS, x => x.total) * 100 / P.income, 0) + '%' : '-'}</dd></dl></div>`;
      };

      /* ---- ส่วนที่ 4: เทียบปีต่อปี ---- */
      const yoyTab = () => {
        const y = +(st.mode === 'all' ? today() : st.ym).slice(0, 4);
        const years = [y - 2, y - 1, y];
        const YP = years.map(yy => pnl(`${yy}-01-01`, `${yy}-12-31`));
        const months = TH_MON;
        const series = years.map((yy, i) => ({ name: 'ปี ' + (yy + 543), color: ['var(--ink3)', 'var(--amber)', 'var(--pri2)'][i], values: months.map((_, m) => pnl(`${yy}-${String(m + 1).padStart(2, '0')}-01`, lastDay(`${yy}-${String(m + 1).padStart(2, '0')}`)).profit) }));
        const metrics = [
          ['รายรับรวม', x => x.income, baht, true],
          ['ค่าใช้จ่ายรวม', x => x.cost, baht, false],
          ['กำไรสุทธิ', x => x.profit, baht, true],
          ['ยางที่ขาย (กก.)', x => x.kg, v => fmt(v, 0), true],
          ['ราคาเฉลี่ย บ./กก.', x => x.kg ? x.gross / x.kg : 0, v => fmt(v, 2), true],
          ['วันกรีด', x => x.tapDays, v => fmt(v, 0), true],
        ];
        return `
        <div class="card"><h3>${ic('chart')} กำไรรายเดือน เทียบ 3 ปี</h3>${lineChart(months, series, { h: 200, yfmt: bahtS, zero: true })}</div>
        <div class="card"><h3>${ic('trend')} เทียบตัวเลขรายปี</h3><div class="tbl-wrap"><table class="tbl">
          <tr><th>รายการ</th>${years.map(yy => `<th class="n">${yy + 543}</th>`).join('')}<th class="n">เทียบปีก่อน</th></tr>
          ${metrics.map(([l, f, fm, goodUp]) => `<tr><td>${l}</td>${YP.map(x => `<td class="n tnum">${fm(f(x))}</td>`).join('')}<td class="n">${chgBadge(f(YP[2]), f(YP[1]), goodUp)}</td></tr>`).join('')}
        </table></div></div>
        ${PV ? `<div class="card"><h3>${ic('calc')} ${periodLabel(st)} เทียบช่วงเดียวกันปีก่อน</h3><div class="tbl-wrap"><table class="tbl">
          <tr><th>รายการ</th><th class="n">ช่วงนี้</th><th class="n">ปีก่อน</th><th class="n">เปลี่ยน</th></tr>
          <tr><td>กำไรสุทธิ</td><td class="n">${baht(P.profit)}</td><td class="n">${baht(PV.profit)}</td><td class="n">${chgBadge(P.profit, PV.profit)}</td></tr>
          <tr><td>ยางที่ขาย</td><td class="n">${fmt(P.kg, 0)} กก.</td><td class="n">${fmt(PV.kg, 0)} กก.</td><td class="n">${chgBadge(P.kg, PV.kg)}</td></tr>
          <tr><td>ต้นทุนต่อ กก.</td><td class="n tnum">${fmt(C.perKg, 2)}</td><td class="n tnum">${fmt(CV.perKg, 2)}</td><td class="n">${chgBadge(C.perKg, CV.perKg, false)}</td></tr>
          <tr><td>ราคาขายเฉลี่ย</td><td class="n tnum">${fmt(C.avgPrice, 2)}</td><td class="n tnum">${fmt(CV.avgPrice, 2)}</td><td class="n">${chgBadge(C.avgPrice, CV.avgPrice)}</td></tr>
          <tr><td>จุดคุ้มทุน</td><td class="n tnum">${fmt(C.breakEven, 2)}</td><td class="n tnum">${fmt(CV.breakEven, 2)}</td><td class="n">${chgBadge(C.breakEven, CV.breakEven, false)}</td></tr>
        </table></div></div>` : ''}`;
      };

      /* ---- ส่วนที่ 5: ลองปรับราคา ---- */
      const whatTab = () => `
        <div class="card"><h3>${ic('slider')} ถ้าราคายางหรือต้นทุนเปลี่ยน กำไรจะเป็นเท่าไร</h3>
        <p class="small muted">อ้างอิงจากผลจริงของ ${periodLabel(st)}: ขาย ${fmt(C.kg, 0)} กก. ที่ราคาเฉลี่ย ${fmt(C.avgPrice, 2)} บ./กก. ต้นทุนคงที่ ${baht(C.fixed)}</p>
        <div class="field"><label class="fl">ราคายาง <span id="wPriceL"></span></label><input type="range" id="wPrice" min="-40" max="40" step="1" value="0" class="rng"></div>
        <div class="field"><label class="fl">ต้นทุน <span id="wCostL"></span></label><input type="range" id="wCost" min="-40" max="40" step="1" value="0" class="rng"></div>
        <div class="field"><label class="fl">ผลผลิต <span id="wKgL"></span></label><input type="range" id="wKg" min="-40" max="40" step="1" value="0" class="rng"></div>
        <div id="wOut" style="margin-top:6px"></div>
        <div class="row wrap" style="margin-top:10px"><button class="btn sm" data-wpreset="-20,0,0">ราคาตก 20%</button><button class="btn sm" data-wpreset="20,0,0">ราคาขึ้น 20%</button><button class="btn sm" data-wpreset="0,15,0">ปุ๋ย/ค่าแรงแพงขึ้น 15%</button><button class="btn sm" data-wpreset="0,0,0">รีเซ็ต</button></div>
        </div>`;

      const body = { cost: costTab, plots: plotTab, people: peopleTab, yoy: yoyTab, what: whatTab }[st.tab] || costTab;
      main.innerHTML = `${periodNav(st)}
        <div class="chips">${tabs.map(([k, l]) => `<button class="chip${st.tab === k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
        <div class="card hero"><div class="small faint">กำไรสุทธิ ${periodLabel(st)}${curFarm !== 'all' ? ' · ' + esc(farmName(curFarm)) : ''}</div>
          <div style="font-size:30px;font-weight:700" class="tnum">${baht(P.profit)}</div>
          <div class="small faint">${C.kg ? `กำไร ${fmt(C.marginPerKg, 2)} บ./กก. · ต้นทุน ${fmt(C.perKg, 2)} บ./กก.` : 'ยังไม่มีการขายในช่วงนี้'}${PV ? ` · เทียบปีก่อน ${chgBadge(P.profit, PV.profit)}` : ''}</div></div>
        ${body()}
        <div class="row wrap no-print" style="margin-top:12px"><button class="btn" id="pCsv">${ic('download')} ดาวน์โหลด CSV</button><button class="btn" onclick="window.print()">${ic('print')} พิมพ์/บันทึก PDF</button></div>`;
      bindPeriod(main, st, draw);
      $$('[data-tab]', main).forEach(c => c.onclick = () => { st.tab = c.dataset.tab; draw(); });
      const al = $('#pAlloc', main); if (al) al.onchange = () => { st.alloc = al.checked; draw(); };
      if (st.tab === 'what') bindWhatIf(main, C, P);
      $('#pCsv', main).onclick = () => {
        const rows = [['วิเคราะห์กำไร', periodLabel(st)], [], ['ต้นทุนแยกหมวด', 'บาท', 'บาท/กก.'],
          ...C.parts.map(([l, v]) => [l, r2(v), C.kg ? r2(v / C.kg) : 0]),
          ['รวมต้นทุน', C.total, C.perKg], ['ราคาขายเฉลี่ย', P.gross, C.avgPrice], ['กำไรต่อกิโล', r2(P.income - C.total), C.marginPerKg],
          ['จุดคุ้มทุน (บาท/กก.)', C.breakEven], ['ปริมาณคุ้มทุน (กก.)', C.breakEvenKg], [],
          ['แปลง', 'ไร่', 'กก.', 'กก./ไร่', 'ต้นทุน/กก.', 'กำไร', 'กำไร/ไร่'],
          ...PS.rows.map(x => [x.p.name, x.area, x.kg, x.kgRai, x.costKg, x.profit, x.profitRai]), [],
          ['คนงาน', 'วันกรีด', 'กก.', 'กก./วัน', 'ส่วนแบ่ง', 'ค่าแรง', 'รายได้/วัน'],
          ...WS.map(x => [x.w.name, x.days, x.kg, x.kgDay, x.share, x.wage, x.bahtDay])];
        downloadFile(`วิเคราะห์กำไร_${periodLabel(st).replace(/\s/g, '_')}.csv`, '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv');
      };
    };
    draw();
  }
};

function bindWhatIf(main, C, P) {
  const price = $('#wPrice', main), cost = $('#wCost', main), kgEl = $('#wKg', main), out = $('#wOut', main);
  if (!price) return;
  const model = (dp, dc, dk) => {
    const kg = C.kg * (1 + dk), pr = C.avgPrice * (1 + dp);
    const net = kg * pr - (P.kg ? P.deduct * (1 + dk) : 0);
    const tapper = net * (C.sharePct / 100);
    const fixed = C.fixed * (1 + dc);
    const income = net - tapper + P.other;
    return { kg, pr, fixed, income, profit: income - fixed };
  };
  const zero = model(0, 0, 0);
  const shift = P.profit - zero.profit;   // ให้ค่าที่ 0% ตรงกับกำไรจริงพอดี
  const calc = () => {
    const dp = num(price.value) / 100, dc = num(cost.value) / 100, dk = num(kgEl.value) / 100;
    const m = model(dp, dc, dk);
    const kg = m.kg, pr = m.pr, fixed = m.fixed, income = m.income + shift;
    const profit = r2(income - fixed);
    const base = P.profit;
    $('#wPriceL', main).innerHTML = `<b class="tnum">${fmt(pr, 2)} บ./กก.</b> <span class="xs ${dp > 0 ? 'pos' : dp < 0 ? 'neg' : 'faint'}">(${dp >= 0 ? '+' : ''}${fmt(dp * 100, 0)}%)</span>`;
    $('#wCostL', main).innerHTML = `<b class="tnum">${baht(fixed)}</b> <span class="xs ${dc > 0 ? 'neg' : dc < 0 ? 'pos' : 'faint'}">(${dc >= 0 ? '+' : ''}${fmt(dc * 100, 0)}%)</span>`;
    $('#wKgL', main).innerHTML = `<b class="tnum">${fmt(kg, 0)} กก.</b> <span class="xs ${dk > 0 ? 'pos' : dk < 0 ? 'neg' : 'faint'}">(${dk >= 0 ? '+' : ''}${fmt(dk * 100, 0)}%)</span>`;
    const be = kg && C.ownerKeep > 0 ? fixed / (kg * C.ownerKeep) : 0;
    out.innerHTML = `<div class="grid2">

/* ---------------- ประวัติการแก้ไข (เก็บในเครื่อง) ---------------- */
const HIST_MAX = 250;
const HIST_PRE = '__hist|';
const memHist = [];
let histSeq = 0;
const histKey = () => HIST_PRE + String(Date.now()).padStart(14, '0') + '.' + String(++histSeq).padStart(3, '0');

async function histPut(entry) {
  const e = { id: histKey().slice(HIST_PRE.length), ...entry };
  if (store.mode !== 'idb' || !store.db) { memHist.push(e); while (memHist.length > HIST_MAX) memHist.shift(); return; }
  try {
    await new Promise(res => { const tx = store.db.transaction('rec', 'readwrite'); tx.objectStore('rec').put(e, HIST_PRE + e.id); tx.oncomplete = () => res(); tx.onerror = () => res(); });
  } catch (x) { }
}
async function histList(limit = HIST_MAX) {
  if (store.mode !== 'idb' || !store.db) return [...memHist].reverse().slice(0, limit);
  try {
    return await new Promise(res => {
      const out = []; const tx = store.db.transaction('rec');
      const rng = IDBKeyRange.bound(HIST_PRE, HIST_PRE + '￿');
      const cur = tx.objectStore('rec').openCursor(rng, 'prev');
      cur.onsuccess = e => { const c = e.target.result; if (c && out.length < limit) { out.push(c.value); c.continue(); } else res(out); };
      cur.onerror = () => res(out);
    });
  } catch (x) { return []; }
}
async function histTrim() {
  if (store.mode !== 'idb' || !store.db) return;
  try {
    const keys = await new Promise(res => {
      const out = []; const tx = store.db.transaction('rec');
      const cur = tx.objectStore('rec').openKeyCursor(IDBKeyRange.bound(HIST_PRE, HIST_PRE + '￿'));
      cur.onsuccess = e => { const c = e.target.result; if (c) { out.push(c.key); c.continue(); } else res(out); };
      cur.onerror = () => res(out);
    });
    if (keys.length <= HIST_MAX) return;
    const drop = keys.slice(0, keys.length - HIST_MAX);
    await new Promise(res => { const tx = store.db.transaction('rec', 'readwrite'); const os = tx.objectStore('rec'); drop.forEach(k => os.delete(k)); tx.oncomplete = () => res(); tx.onerror = () => res(); });
  } catch (x) { }
}

function recLabel(coll, r) {
  try {
    switch (coll) {
      case 'sales': return `${PRODUCTS[r.product] || 'ขายยาง'} ${fmt(r.weight, 1)} กก. ${baht(saleCalc(r).net)}`;
      case 'tapping': return `กรีด ${plotName(r.plotId) || 'ไม่ระบุแปลง'} ${num(r.qty) ? fmt(r.qty, 1) + ' กก.' : ''}`;
      case 'expenses': return `${r.item || r.cat || 'รายจ่าย'} ${baht(r.amount)}`;
      case 'incomes': return `${r.cat || 'รายรับ'} ${baht(r.amount)}`;
      case 'worklogs': return `ค่าแรง ${workerName(r.workerId)} ${baht(wageAmt(r))}`;
      case 'payments': return `${PAYMENT_TYPES[r.type] || 'จ่ายเงิน'} ${workerName(r.workerId)} ${baht(r.amount)}`;
      case 'activities': return `${r.type || 'งานดูแลสวน'} ${plotName(r.plotId)}`;
      case 'health': return `${r.issue || 'สุขภาพต้น'} ${plotName(r.plotId)}`;
      case 'prices': return `ราคา${PRODUCTS[r.product] || ''} ${fmt(r.price, 2)} บ.`;
      case 'stock': return `คลัง ${itemOf(r.itemId)?.name || ''} ${fmt(r.qty)}`;
      case 'events': return r.title || 'นัดหมาย';
      case 'claims': return r.program || 'สิทธิ กยท.';
      default: return r.name || r.title || SCHEMA[coll]?.title || coll;
    }

}

/* บันทึกประวัติทุกครั้งที่บันทึก/ลบ */
(function hookSave() {
  const rawSave = saveRec;
  saveRec = async function (coll, rec, opts = {}) {
    const before = rec.id ? DB[coll].get(rec.id) : null;
    const out = await rawSave(coll, rec, opts);
    try {
      if (!opts.noHist && !out.demo && SCHEMA[coll]) {
        const action = !before ? 'create' : (out.deleted && !before.deleted) ? 'delete' : (!out.deleted && before.deleted) ? 'restore' : 'edit';
        await histPut({ coll, recId: out.id, at: Date.now(), action, label: recLabel(coll, out), before: before ? JSON.parse(JSON.stringify(before)) : null });
        if (Math.random() < 0.08) histTrim();
      }
    } catch (e) { }
    return out;
  };
})();

/* ---------------- จุดกู้คืนในเครื่อง (snapshot) ---------------- */
const SNAP_PRE = 'snap:';
const SNAP_KEEP = 4;
function snapshotData() { const data = {}; COLLS.forEach(c => data[c] = [...DB[c].values()]); return { app: 'rubberfarm', version: APP_VERSION, exportedAt: new Date().toISOString(), data }; }
function snapCount(s) { return COLLS.reduce((a, c) => a + ((s.data && s.data[c]) || []).length, 0); }
async function snapPut(name, obj) {
  if (store.mode !== 'idb' || !store.db) return false;
  return new Promise(res => { try { const tx = store.db.transaction('meta', 'readwrite'); tx.objectStore('meta').put(obj, SNAP_PRE + name); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
}
async function snapKeys() {
  if (store.mode !== 'idb' || !store.db) return [];
  return new Promise(res => {
    try {
      const out = []; const tx = store.db.transaction('meta');
      const cur = tx.objectStore('meta').openKeyCursor(IDBKeyRange.bound(SNAP_PRE, SNAP_PRE + '￿'));
      cur.onsuccess = e => { const c = e.target.result; if (c) { out.push(String(c.key).slice(SNAP_PRE.length)); c.continue(); } else res(out.sort().reverse()); };
      cur.onerror = () => res(out);
    } catch (e) { res([]); }
  });
}
async function snapGet(name) {
  if (store.mode !== 'idb' || !store.db) return null;
  return new Promise(res => { try { const tx = store.db.transaction('meta'); const q = tx.objectStore('meta').get(SNAP_PRE + name); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } });
}
async function snapDel(name) {
  if (store.mode !== 'idb' || !store.db) return;
  return new Promise(res => { try { const tx = store.db.transaction('meta', 'readwrite'); tx.objectStore('meta').delete(SNAP_PRE + name); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });
}
async function makeSnapshot(tag = '') {
  const total = COLLS.reduce((a, c) => a + DB[c].size, 0);
  if (!total) return null;
  const name = today() + '_' + nowTime().replace(':', '') + (tag ? '_' + tag : '');
  const ok = await snapPut(name, snapshotData());
  if (!ok) return null;
  const keys = await snapKeys();
  for (const k of keys.slice(SNAP_KEEP)) await snapDel(k);
  META.lastSnapAt = Date.now(); await store.putMeta();
  return name;
}
/** สำรองอัตโนมัติสัปดาห์ละครั้ง (ตอนเปิดแอพ เมื่อเครื่องว่าง) */
function autoSnapshot() {
  const last = num(META.lastSnapAt);
  if (Date.now() - last < 7 * 864e5) return;
  const run = () => makeSnapshot('auto').catch(() => { });
  if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 8000 }); else setTimeout(run, 4000);
}

/* ---------------- กู้คืนข้อมูล ---------------- */
async function restoreRecords(j, mode = 'merge') {
  if (!j || !j.data) { toast('ไฟล์ไม่ถูกต้อง', 'err'); return 0; }
  let n = 0;
  for (const c of COLLS) {
    const puts = [];
    (j.data[c] || []).forEach(raw => {
      const r = coerce(c, raw); if (!r.id) return;
      const loc = DB[c].get(r.id);
      const take = mode === 'replace' ? true : (!loc || num(r.updatedAt) > num(loc.updatedAt));
      if (!take) return;
      if (mode === 'replace' && loc) r.updatedAt = Math.max(num(r.updatedAt), num(loc.updatedAt) + 1);
      DB[c].set(r.id, r); puts.push(r);
      const d = META.dirty[c] || (META.dirty[c] = []); if (!d.includes(r.id)) d.push(r.id);
      n++;
    });
    if (puts.length) await store.putRecs(c, puts);
  }
  await store.putMeta();
  return n;
}

/* ---------------- ตรวจสุขภาพข้อมูล ---------------- */
function dataChecks() {
  const t = today(), out = [];
  const add = (level, title, detail, goTo) => out.push({ level, title, detail, go: goTo });
  const s = S();

  // 1. การเชื่อมต่อและซิงค์
  if (!s.scriptUrl) add('bad', 'ยังไม่ได้เชื่อม Google Sheets', 'ข้อมูลอยู่ในเครื่องนี้เครื่องเดียว ถ้าเครื่องหายหรือลบแอพ ข้อมูลจะหายทั้งหมด', 'settings');
  else {
    const n = dirtyCount();
    const days = META.lastSyncAt ? Math.floor((Date.now() - META.lastSyncAt) / 864e5) : 999;
    if (n && days >= 3) add('bad', `มี ${n} รายการยังไม่ขึ้น Google Sheets`, `ซิงค์ล่าสุด ${META.lastSyncAt ? days + ' วันที่แล้ว' : 'ยังไม่เคยซิงค์'}`, 'settings');
    else if (n) add('warn', `รอซิงค์ ${n} รายการ`, 'จะส่งขึ้นเองเมื่อมีอินเทอร์เน็ต', 'settings');
    else add('ok', 'ซิงค์กับ Google Sheets ครบแล้ว', META.lastSyncAt ? 'ล่าสุด ' + new Date(META.lastSyncAt).toLocaleString('th-TH') : '');
  }
  // 2. สำรองไฟล์
  const bdays = META.lastBackupAt ? Math.floor((Date.now() - META.lastBackupAt) / 864e5) : null;
  if (bdays === null) add('warn', 'ยังไม่เคยดาวน์โหลดไฟล์สำรอง', 'ควรเก็บไฟล์สำรองไว้ในเครื่องหรือแชทไลน์ตัวเอง อย่างน้อยปีละ 2–3 ครั้ง');
  else if (bdays > 90) add('warn', `ไฟล์สำรองล่าสุด ${bdays} วันที่แล้ว`, 'ควรดาวน์โหลดไฟล์สำรองใหม่');
  else add('ok', 'มีไฟล์สำรองล่าสุด', `${bdays} วันที่แล้ว`);
  // 3. รูปที่ยังไม่อัป
  const pend = PHOTO_COLLS.reduce((a, c) => a + list(c, r => hasLocalPhotos(r)).length, 0);
  if (pend) add('warn', `รูป ${pend} รายการยังไม่ขึ้น Google Drive`, 'รูปจะอัปโหลดตอนซิงค์ ถ้าค้างนานให้กดซิงค์ตอนมีเน็ตแรง', 'settings');
  // 4. ขายที่ไม่ระบุแปลง
  const noPlot = list('sales', r => !r.plotId && inFarm(r)).length;
  if (noPlot) add('info', `ขายยาง ${noPlot} ครั้งไม่ได้ระบุแปลง`, 'ถ้าระบุแปลง จะดูกำไรรายแปลงได้แม่นขึ้น', 'sales');
  // 5. แปลงที่ข้อมูลไม่ครบ
  const badPlot = list('plots', p => inFarm(p) && (!plotArea(p) || !num(p.trees)));
  if (badPlot.length) add('warn', `แปลง ${badPlot.length} แปลงยังไม่ได้กรอกพื้นที่หรือจำนวนต้น`, badPlot.map(p => p.name).join(', '), 'plots');
  // 6. วัสดุติดลบ
  const negStock = list('items', i => itemStock(i.id) < 0);
  if (negStock.length) add('warn', `วัสดุ ${negStock.length} รายการคงเหลือติดลบ`, negStock.map(i => `${i.name} (${fmt(itemStock(i.id))})`).join(', '), 'inventory');
  // 7. วันที่ในอนาคต
  const future = [];
  ['sales', 'tapping', 'expenses', 'worklogs'].forEach(c => list(c, r => r.date > addDays(t, 1)).forEach(r => future.push([c, r])));
  if (future.length) add('warn', `${future.length} รายการมีวันที่เป็นอนาคต`, 'อาจพิมพ์ปีหรือวันผิด: ' + future.slice(0, 3).map(([c, r]) => `${recLabel(c, r)} (${thDate(r.date)})`).join(', '));
  // 8. ขายซ้ำ
  const seen = new Map(), dup = [];
  list('sales').forEach(r => { const k = `${r.date}|${r.product}|${r2(num(r.weight))}|${r2(num(r.price))}`; if (seen.has(k)) dup.push(r); else seen.set(k, r); });
  if (dup.length) add('warn', `อาจบันทึกขายซ้ำ ${dup.length} รายการ`, dup.slice(0, 3).map(r => `${thDate(r.date)} ${PRODUCTS[r.product] || ''} ${fmt(r.weight, 1)} กก.`).join(', '), 'sales');
  // 9. ค้างจ่ายนาน
  const oldOwe = list('workers').map(w => ({ w, L: workerLedger(w.id) })).filter(x => x.L.balance > 0 && x.L.rows.length && diffDays(x.L.rows.filter(r => r.kind === 'pay' || r.kind === 'advance').slice(-1)[0]?.date || x.L.rows[0].date, t) > 60);
  if (oldOwe.length) add('info', `ค้างจ่ายคนงาน ${oldOwe.length} คนเกิน 60 วัน`, oldOwe.map(x => `${x.w.name} ${baht(x.L.balance)}`).join(', '), 'workers');
  // 10. ค้างรับเงินค่ายาง
  const oldRecv = list('sales', r => !r.received && diffDays(r.date, t) > 30);
  if (oldRecv.length) add('warn', `ยังไม่ได้รับเงินค่ายาง ${oldRecv.length} ครั้ง เกิน 30 วัน`, baht(sum(oldRecv, r => saleCalc(r).net)), 'sales');
  // 11. รายจ่ายไม่มีหมวด
  const noCat = list('expenses', r => !r.cat).length;
  if (noCat) add('info', `รายจ่าย ${noCat} รายการไม่มีหมวดหมู่`, 'ทำให้ดูสัดส่วนต้นทุนไม่ครบ', 'expenses');
  // 12. ขนาดข้อมูล
  const total = COLLS.reduce((a, c) => a + list(c).length, 0);
  add('ok', `ข้อมูลในเครื่อง ${fmt(total, 0)} รายการ`, `เก็บแบบ ${store.mode === 'idb' ? 'IndexedDB (ปลอดภัยกว่า)' : 'localStorage (พื้นที่จำกัด)'}`);
  return out;
}

   --------------------------------------------------------- */
weekStrip = function () {
  const t = today(), days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i);
    days.push({
      d,
      kg: sum(list('sales', s => s.date === d && inFarm(s)), estDryKg),
      tap: list('tapping', r => r.date === d && r.rain !== 'skip' && inFarm(r)).length,
      skip: list('tapping', r => r.date === d && r.rain === 'skip' && inFarm(r)).length,
    });
  }
  const mx = Math.max(...days.map(x => x.kg));
  const total = sum(days, x => x.kg);
  const tapDays = days.filter(x => x.tap).length;
  const bars = days.filter(x => x.kg).length >= 3;   // ใช้กราฟแท่งเมื่อมีข้อมูลพอ
  const cell = x => {
    const inner = bars
      ? `<span class="trk"><i style="height:${mx && x.kg ? Math.max(3, x.kg / mx * 26).toFixed(0) : 0}px"></i></span>`
      : `<span class="vbox">${x.kg ? `<b class="tnum">${fmt(x.kg, 0)}</b>` : '<u>·</u>'}</span>`;
    return `<div class="wd${x.d === t ? ' on' : ''}" title="${thDate(x.d)}${x.kg ? ' · ขาย ' + fmt(x.kg, 0) + ' กก.' : ''}${x.tap ? ' · กรีด ' + x.tap + ' แปลง' : x.skip ? ' · หยุดกรีด' : ''}">
      <span class="dw">${TH_DOW[parseD(x.d).getDay()]}</span>${inner}<em class="${x.tap ? 'tap' : x.skip ? 'skip' : ''}"></em></div>`;
  };
  return `<div class="wkbox">
    <div class="wkh"><span>7 วันล่าสุด</span><b>${total ? fmt(total, 0) + ' กก.' : 'ยังไม่มีการขาย'}${tapDays ? ` · กรีด ${tapDays} วัน` : ''}</b></div>
    <div class="week${bars ? ' bars' : ''}">${days.map(cell).join('')}</div>
    <div class="wkl"><span><em class="tap"></em> วันที่กรีด</span><span><em class="skip"></em> หยุดกรีด</span>${bars ? '' : '<span>ตัวเลข = กก. ที่ขาย</span>'}</div>
  </div>`;
};

function stackTables(root) {
  $$('.tbl-wrap table.tbl', root).forEach(tb => {
    if (tb.dataset.st) return;
    const rows = [...tb.rows];
    if (!rows.length) return;
    const head = rows[0];
    const ths = [...head.cells].filter(c => c.tagName === 'TH');
    if (ths.length < 4 || head.cells.length !== ths.length) { tb.dataset.st = 0; return; }
    const labels = ths.map(c => c.textContent.trim());
    rows.slice(1).forEach(r => {
      [...r.cells].forEach((c, i) => {
        if (!i || !labels[i] || c.querySelector(':scope > .lb')) return;
        const sp = document.createElement('span');
        sp.className = 'lb'; sp.textContent = labels[i];
        c.insertBefore(sp, c.firstChild);
      });
    });
    tb.classList.add('stackable');
    tb.dataset.st = 1;
  });
}

  if (!main || _polishing) return;
  _polishing = true;
  try { stackTables(main); } catch (e) { }
  try { tidyListPage(main); } catch (e) { }
  try { decorateDates(main); } catch (e) { }
  _polishing = false;
}
(function wrapRender33() {
  const raw = render;
  render = function () {
    raw.apply(this, arguments);
    polish33($('#main'));
  };
  // หน้าที่วาดใหม่เองข้างใน (เปลี่ยนเดือน/ตัวกรอง/แท็บ) ต้องจัดหน้าตาใหม่ด้วย
  const start = () => {
    const main = $('#main'); if (!main) return setTimeout(start, 300);
    const mo = new MutationObserver(debounce(() => polish33(main), 80));
    mo.observe(main, { childList: true, subtree: true });
    polish33(main);
  };
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
