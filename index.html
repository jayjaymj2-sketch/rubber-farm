<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สวนยางพารา</title>
<meta name="description" content="แอพบริหารจัดการสวนยางพารา บันทึกการกรีด ขายยาง แบ่งรายได้ ค่าแรง รายจ่าย และรายงานกำไรขาดทุน">
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="สวนยาง">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#047857; --pri2:#059669; --pri-soft:#d1fae5; --pri-ink:#064e3b;
  --bg:#f3f6f4; --card:#ffffff; --card2:#f8faf9; --line:#e2e8e4; --ink:#14201a; --ink2:#51615a; --ink3:#86958e;
  --red:#dc2626; --red-soft:#fee2e2; --amber:#d97706; --amber-soft:#fef3c7; --blue:#2563eb; --blue-soft:#dbeafe;
  --violet:#7c3aed; --violet-soft:#ede9fe; --shadow:0 1px 2px rgba(16,40,30,.06),0 4px 14px rgba(16,40,30,.06);
  --r:14px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pri:#10b981; --pri2:#34d399; --pri-soft:#0f3a2c; --pri-ink:#a7f3d0;
    --bg:#0c1411; --card:#141f1a; --card2:#101a16; --line:#23322b; --ink:#e5efe9; --ink2:#a3b5ac; --ink3:#6f8279;
    --red:#f87171; --red-soft:#3b1717; --amber:#fbbf24; --amber-soft:#3a2c0b; --blue:#60a5fa; --blue-soft:#132544;
    --violet:#a78bfa; --violet-soft:#2a1f47; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --pri:#10b981; --pri2:#34d399; --pri-soft:#0f3a2c; --pri-ink:#a7f3d0;
  --bg:#0c1411; --card:#141f1a; --card2:#101a16; --line:#23322b; --ink:#e5efe9; --ink2:#a3b5ac; --ink3:#6f8279;
  --red:#f87171; --red-soft:#3b1717; --amber:#fbbf24; --amber-soft:#3a2c0b; --blue:#60a5fa; --blue-soft:#132544;
  --violet:#a78bfa; --violet-soft:#2a1f47; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs,15px);line-height:1.5;min-height:100vh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.num,.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--top-bg,var(--pri));color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
:root[data-theme="dark"] .top{background:#0f2a20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#0f2a20}}
.top .back{background:none;border:0;color:#fff;padding:6px;margin-left:-6px;border-radius:10px;display:none}
.top.has-back .back{display:inline-flex}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.top h1 .logo{width:26px;height:26px}
.farm-sel{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:6px 8px;max-width:42vw;font-size:13px}
.farm-sel option{color:#111}
.sync-btn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:6px 8px;display:inline-flex;align-items:center;gap:4px;font-size:12px;position:relative}
.sync-btn .dot{width:8px;height:8px;border-radius:50%;background:#a7f3d0}
.sync-btn.pending .dot{background:#fcd34d}
.sync-btn.err .dot{background:#fca5a5}
.sync-btn.off .dot{background:#9ca3af}
.sync-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:760px;margin:0 auto;padding:12px 12px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom))}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;width:100%;max-width:760px}
.nav button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);min-height:var(--nav-h)}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--pri)}
.nav .add-btn span.b{background:var(--pri);color:#fff;border-radius:16px;width:48px;height:34px;display:flex;align-items:center;justify-content:center}
.nav .add-btn span.b svg{width:24px;height:24px}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 .link{font-size:13px;font-weight:500;color:var(--pri);background:none;border:0;padding:0;cursor:pointer}
.sec-title{font-size:13px;font-weight:600;color:var(--ink2);margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:13px}.xs{font-size:12px}
.pos{color:var(--pri)}.neg{color:var(--red)}.warn{color:var(--amber)}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.kpi .l svg{width:15px;height:15px}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--hero-bg,linear-gradient(135deg,#065f46,#047857 55%,#0d9488));color:#fff;border:0;position:relative;overflow:hidden}
.hero .muted,.hero .faint{color:rgba(255,255,255,.8)}

/* list items */
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.item{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item:active{background:var(--card2)}
.item .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--pri-soft);color:var(--pri)}
.item .ic.red{background:var(--red-soft);color:var(--red)}.item .ic.amber{background:var(--amber-soft);color:var(--amber)}
.item .ic.blue{background:var(--blue-soft);color:var(--blue)}.item .ic.violet{background:var(--violet-soft);color:var(--violet)}
.item .ic img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d2{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.item .r .a{font-weight:700}
.empty{text-align:center;padding:36px 16px;color:var(--ink3)}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:6px}
.day-h{font-size:12px;color:var(--ink3);padding:10px 14px 4px;background:var(--card2);border-bottom:1px solid var(--line);display:flex}
.day-h span:last-child{margin-left:auto}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri-soft);color:var(--pri-ink);font-weight:500;white-space:nowrap;vertical-align:middle}
:root[data-theme="dark"] .badge{color:var(--pri2)}
.badge.red{background:var(--red-soft);color:var(--red)}.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.gray{background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.badge.violet{background:var(--violet-soft);color:var(--violet)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-height:44px;font-size:14px}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;box-shadow:var(--shadow);cursor:pointer}
.quick button span.q{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--pri-soft);color:var(--pri)}

.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.menu-grid{grid-template-columns:repeat(4,1fr)}}
.menu-grid button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;box-shadow:var(--shadow);cursor:pointer;text-align:center;line-height:1.25}
.menu-grid button span.q{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--pri-soft);color:var(--pri)}
.menu-grid button span.q svg{width:24px;height:24px}

/* month nav */
.mnav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mnav .lbl{flex:1;text-align:center;font-weight:600}
.mnav button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;margin-bottom:10px}

.sumbar{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.sumbar::-webkit-scrollbar{display:none}
.sumbar .s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex-shrink:0;min-width:110px}
.sumbar .s .l{font-size:11px;color:var(--ink2)}
.sumbar .s .v{font-weight:700;font-variant-numeric:tabular-nums}

.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:25;background:var(--pri);color:#fff;border:0;border-radius:18px;height:54px;padding:0 18px;display:flex;align-items:center;gap:6px;font-weight:600;box-shadow:0 6px 20px rgba(4,120,87,.35);cursor:pointer}
.fab svg{width:22px;height:22px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--ink2);font-weight:500}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-h{display:flex;align-items:center;padding:14px 16px 10px;gap:8px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px;flex:1}
.sheet-h .x{background:var(--card);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet-b{overflow-y:auto;padding:14px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.sheet-f .btn{flex:1}
.sheet-f .btn.danger{flex:0 0 auto}

.fields{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 10px}
.field{grid-column:span 6;min-width:0}
.field.half{grid-column:span 3}
.field.third{grid-column:span 2}
.field label.fl{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.field label.fl .req{color:var(--red)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;min-height:44px;font-size:16px;appearance:none;-webkit-appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.inp{min-height:70px;resize:vertical}
.inp:focus{outline:2px solid var(--pri2);outline-offset:-1px;border-color:transparent}
.inp.bad{border-color:var(--red);background:var(--red-soft)}
.inp-wrap{position:relative}
.inp-wrap .suf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px;pointer-events:none}
.inp-wrap .inp.has-suf{padding-right:52px}
.hint{font-size:12px;color:var(--ink3);margin-top:3px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips label{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;user-select:none}
.mchips input{display:none}
.mchips label:has(input:checked){background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:14px;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){background:var(--card);box-shadow:var(--shadow);color:var(--pri);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--pri)}
.preview{background:var(--pri-soft);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.preview .kv dd{font-weight:600}
.preview .big{font-size:22px;font-weight:700;color:var(--pri-ink)}
:root[data-theme="dark"] .preview .big{color:var(--pri2)}
.photo-box{display:flex;gap:10px;align-items:center}
.photo-box img{width:88px;height:88px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}

/* toast */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:#1f2d27;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s;max-width:520px}
.toast.warn{background:#92400e}.toast.err{background:#991b1b}.toast.ok{background:#065f46}

/* weather */
.wx-now{display:flex;align-items:center;gap:12px}
.wx-now .t{font-size:34px;font-weight:700;line-height:1}
.wx-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wx-d{text-align:center;font-size:12px;padding:6px 2px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.wx-d .e{font-size:20px;line-height:1.3}
.wx-d .tap{margin-top:3px;height:6px;border-radius:3px;background:var(--pri2)}
.wx-d .tap.no{background:var(--red)}.wx-d .tap.maybe{background:var(--amber)}
.hero .wx-d{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:11px;text-align:center;color:var(--ink3);padding:4px 0}
.cal .c{aspect-ratio:1/1.05;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:3px;font-size:13px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0}
.cal .c.o{opacity:.35}
.cal .c.td{border-color:var(--pri);border-width:2px}
.cal .c.sel{background:var(--pri-soft)}
.cal .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:auto;padding-bottom:2px}
.cal .dots i{width:6px;height:6px;border-radius:50%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--ink3);font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:6px 8px;align-items:center;font-size:13px}
.hbar .bar{height:10px;border-radius:5px;background:var(--pri2);min-width:2px}
.hbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums}

.alert{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--ink);margin-bottom:8px;font-size:14px;align-items:flex-start}
.alert svg{color:var(--amber);margin-top:2px}
.alert.info{background:var(--blue-soft)}.alert.info svg{color:var(--blue)}
.alert.ok{background:var(--pri-soft)}.alert.ok svg{color:var(--pri)}
.alert.red{background:var(--red-soft)}.alert.red svg{color:var(--red)}

.guide h4{margin:14px 0 6px;font-size:15px}
.guide p,.guide li{font-size:14px;color:var(--ink2)}
.guide ul{padding-left:20px;margin:6px 0}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow)}
details.acc summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}

const store = {
  db: null, mode: 'idb',
  open() {
    return new Promise(res => {
      if (!('indexedDB' in window)) { this.mode = 'ls'; return res(); }
      let r; try { r = indexedDB.open('rubberfarm', 2); } catch (e) { this.mode = 'ls'; return res(); }
      r.onupgradeneeded = () => { const d = r.result; ['rec', 'meta', 'photos'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => { this.mode = 'ls'; res(); };
      r.onblocked = () => { this.mode = 'ls'; res(); };
    });
  },
  async loadAll() {
    if (this.mode === 'ls') {
      try { const j = JSON.parse(localStorage.getItem('rubberfarm') || '{}'); COLLS.forEach(c => (j[c] || []).forEach(r => DB[c].set(r.id, r))); META = Object.assign(META, j.__meta || {}); } catch (e) { }
      return;
    }
    const recs = await new Promise((res, rej) => { const out = []; const tx = this.db.transaction('rec'); const cur = tx.objectStore('rec').openCursor(); cur.onsuccess = e => { const c = e.target.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); }; cur.onerror = () => rej(cur.error); });
    recs.forEach(([k, v]) => { const c = k.split('|')[0]; if (DB[c]) DB[c].set(v.id, v); });
    const m = await new Promise(res => { const tx = this.db.transaction('meta'); const q = tx.objectStore('meta').get('meta'); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
    if (m) META = Object.assign(META, m);
  },
  lsFlush: debounce(() => { const j = { __meta: META }; COLLS.forEach(c => j[c] = [...DB[c].values()]); try { localStorage.setItem('rubberfarm', JSON.stringify(j)); } catch (e) { toast('พื้นที่เก็บข้อมูลเต็ม', 'err'); } }, 300),
  putRecs(coll, recs) {
    if (this.mode === 'ls') { this.lsFlush(); return Promise.resolve(); }
    return new Promise((res, rej) => { const tx = this.db.transaction('rec', 'readwrite'); const os = tx.objectStore('rec'); recs.forEach(r => os.put(r, coll + '|' + r.id)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  putMeta() {
    if (this.mode === 'ls') { this.lsFlush(); return Promise.resolve(); }
    return new Promise(res => { const tx = this.db.transaction('meta', 'readwrite'); tx.objectStore('meta').put(JSON.parse(JSON.stringify(META)), 'meta'); tx.oncomplete = () => res(); tx.onerror = () => res(); });
  },
  photo(op, key, val) {
    if (this.mode === 'ls') { if (op === 'get') return Promise.resolve(memPhotos.get(key)); if (op === 'put') memPhotos.set(key, val); else memPhotos.delete(key); return Promise.resolve(); }
    return new Promise(res => {
      try {
        const tx = this.db.transaction('photos', op === 'get' ? 'readonly' : 'readwrite'); const os = tx.objectStore('photos');
        if (op === 'get') { const q = os.get(key); q.onsuccess = () => res(q.result); q.onerror = () => res(null); return; }
        if (op === 'put') os.put(val, key); else os.delete(key);
        tx.oncomplete = () => res(); tx.onerror = () => res();
      } catch (e) { res(null); }
    });
  },
  async clearAll() {
    COLLS.forEach(c => DB[c].clear());
    if (this.mode === 'ls') { localStorage.removeItem('rubberfarm'); return; }
    await new Promise(res => { const tx = this.db.transaction(['rec', 'meta', 'photos'], 'readwrite'); ['rec', 'meta', 'photos'].forEach(n => tx.objectStore(n).clear()); tx.oncomplete = () => res(); tx.onerror = () => res(); });
  }
};

async function saveRec(coll, rec, opts = {}) {
  if (!canEdit() && !opts.force) { toast('บัญชีนี้ดูข้อมูลได้อย่างเดียว', 'warn'); throw new Error('readonly'); }
  const r = { ...rec };
  if (!r.id) { r.id = uid(); r.createdAt = Date.now(); }
  r.updatedAt = Math.max(Date.now(), num(DB[coll].get(r.id)?.updatedAt) + 1);
  r.deleted = r.deleted ? 1 : 0;
  DB[coll].set(r.id, r);
  await store.putRecs(coll, [r]);
  markDirty(coll, r.id);
  return r;
}
async function delRec(coll, id) { const r = DB[coll].get(id); if (r) await saveRec(coll, { ...r, deleted: 1 }); }
function markDirty(coll, id) {
  const d = META.dirty || (META.dirty = {});
  const a = d[coll] || (d[coll] = []);
  if (!a.includes(id)) a.push(id);
  store.putMeta();
  updateSyncBtn();
  scheduleSync();
}

/* ---------------- API (Google Apps Script) ---------------- */
async function api(action, payload = {}) {
  const s = S();
  if (!s.scriptUrl || !s.apiKey) throw new Error('ยังไม่ได้เชื่อมต่อ Google Sheets');
  if (!navigator.onLine) throw new Error('ออฟไลน์อยู่');
  const resp = await fetch(s.scriptUrl, { method: 'POST', body: JSON.stringify(Object.assign({ action, key: s.apiKey }, payload)) });
  const text = await resp.text();
  let data; try { data = JSON.parse(text); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (ตรวจสอบการ Deploy ให้สิทธิ์ "ทุกคน")'); }
  if (!data.ok) throw new Error(data.error || 'ไม่สำเร็จ');
  return data;
}

/* ---------------- photos (local cache + private Drive folder) ---------------- */
const isLocalRef = ref => String(ref).startsWith('l:');
const hasLocalPhotos = r => Array.isArray(r.photos) && r.photos.some(isLocalRef);
async function addLocalPhoto(dataUrl) { const ref = 'l:' + uid(); await store.photo('put', ref, dataUrl); return ref; }
async function photoSrc(ref) {
  if (!ref) return '';
  if (String(ref).startsWith('data:')) return ref;
  const hit = await store.photo('get', ref);
  if (hit) return hit;
  if (String(ref).startsWith('d:')) {
    try { const r = await api('photoGet', { id: ref.slice(2) }); await store.photo('put', ref, r.dataUrl); return r.dataUrl; } catch (e) { return ''; }
  }
  return '';
}
function hydratePhotos(root = document) {
  $$('img[data-ref]', root).forEach(async img => { if (img.dataset.done) return; img.dataset.done = 1; const src = await photoSrc(img.dataset.ref); if (src) img.src = src; else img.alt = '📷'; });
}
let photoErr = '';
async function uploadPendingPhotos() {
  photoErr = '';
  for (const c of PHOTO_COLLS) {
    for (const id of [...((META.dirty || {})[c] || [])]) {
      const r = DB[c].get(id); if (!r || !hasLocalPhotos(r)) continue;

function saleCalc(r) {
  const w = num(r.weight), drc = num(r.drc), price = num(r.price);
  const dryBasis = r.priceBasis === 'dry' && (r.product === 'latex' || r.product === 'cuplump');
  const payKg = dryBasis ? w * drc / 100 : w;
  const dryKg = drc ? w * drc / 100 : (r.product === 'usss' || r.product === 'rss' ? w : 0);
  const gross = r2(payKg * price);
  const net = r2(gross - num(r.deduct));
  const isShare = r.split === 'share';
  const ownerPct = isShare ? Math.min(100, Math.max(0, num(r.ownerPct))) : 100;
  const base = r2(net - (isShare ? num(r.sharedCost) : 0));
  const tapperTotal = isShare ? r2(base * (100 - ownerPct) / 100) : 0;
  const ids = isShare ? (r.workerIds || []) : [];
  const perTapper = ids.length ? r2(tapperTotal / ids.length) : 0;
  const custom = r.shareMode === 'custom' && ids.length > 1 && r.shares && typeof r.shares === 'object';
  const wts = {}; let tot = 0;
  ids.forEach(id => { wts[id] = custom && r.shares[id] !== undefined && r.shares[id] !== '' ? num(r.shares[id]) : 1; tot += wts[id]; });
  const per = {}; ids.forEach(id => per[id] = tot ? r2(tapperTotal * wts[id] / tot) : 0);
  const pctOf = {}; ids.forEach(id => pctOf[id] = tot ? r2(wts[id] * 100 / tot) : 0);
  return { payKg: r2(payKg), dryKg: r2(dryKg), gross, net, base, ownerPct, tapperTotal, perTapper, per, pctOf, custom, ownerNet: r2(net - tapperTotal), ids };
}
const wageAmt = r => r2(num(r.days) * num(r.wage));
// เนื้อยางแห้งโดยประมาณ (ใช้ %DRC ที่บันทึก ถ้าไม่มี: ก้อนถ้วยใช้ค่าตั้งต้น, ยางแผ่นถือว่าแห้ง)
const estDryKg = r => { const w = num(r.weight); if (num(r.drc)) return w * num(r.drc) / 100; if (r.product === 'cuplump') return w * num(S().cupDrc) / 100; if (r.product === 'usss' || r.product === 'rss') return w; if (r.product === 'scrap') return w * 0.5; return 0; };

function workerLedger(wid) {
  const rows = [];
  list('sales', r => r.split === 'share' && (r.workerIds || []).includes(wid)).forEach(r => {
    const c = saleCalc(r);
    rows.push({ date: r.date, kind: 'share', label: `ส่วนแบ่ง${PRODUCTS[r.product] || ''} ${fmt(r.weight)} กก.`, sub: `${fmt(100 - c.ownerPct)}% ของ ${baht(c.base)}${c.ids.length > 1 ? (c.custom ? ` · ได้ ${fmt(c.pctOf[wid])}%` : ` ÷ ${c.ids.length} คน`) : ''}`, amt: c.per[wid] ?? c.perTapper, coll: 'sales', id: r.id, t: r.createdAt });
  });
  list('worklogs', r => r.workerId === wid).forEach(r => rows.push({ date: r.date, kind: 'wage', label: 'ค่าแรง: ' + (r.task || ''), sub: `${fmt(r.days)} วัน × ${baht(r.wage)}${r.plotId ? ' · ' + plotName(r.plotId) : ''}`, amt: wageAmt(r), coll: 'worklogs', id: r.id, t: r.createdAt }));
  list('payments', r => r.workerId === wid).forEach(r => rows.push({ date: r.date, kind: r.type, label: PAYMENT_TYPES[r.type] || 'จ่ายเงิน', sub: [r.method, r.note].filter(Boolean).join(' · '), amt: r.type === 'adjust' ? num(r.amount) : -num(r.amount), coll: 'payments', id: r.id, t: r.createdAt }));
  rows.sort((a, b) => a.date.localeCompare(b.date) || (a.t || 0) - (b.t || 0));
  let bal = 0; rows.forEach(x => { bal = r2(bal + x.amt); x.bal = bal; });
  const earned = r2(sum(rows.filter(x => ['share', 'wage', 'adjust'].includes(x.kind)), 'amt'));
  const paid = r2(-sum(rows.filter(x => x.kind === 'pay' || x.kind === 'advance'), 'amt'));
  const advance = r2(-sum(rows.filter(x => x.kind === 'advance'), 'amt'));
  return { rows, earned, paid, advance, balance: bal };
}

function itemStock(id) {
  const it = DB.items.get(id); let q = num(it?.initQty);
  list('expenses', r => r.itemId === id).forEach(r => q += num(r.qty));
  list('stock', r => r.itemId === id).forEach(r => q += r.dir === 'out' ? -num(r.qty) : num(r.qty));
  list('activities', r => r.itemId === id).forEach(r => q -= num(r.qty));
  return r2(q);
}

function pnl(from, to, farm = curFarm) {
  const inR = r => r.date >= from && r.date <= to && (farm === 'all' || farmOf(r) === farm);
  const sales = list('sales', inR);
  const calc = sales.map(r => ({ r, c: saleCalc(r) }));
  const byProd = {};
  calc.forEach(({ r, c }) => { const p = byProd[r.product] || (byProd[r.product] = { kg: 0, dry: 0, gross: 0, net: 0, n: 0 }); p.kg += num(r.weight); p.dry += c.dryKg; p.gross += c.gross; p.net += c.net; p.n++; });
  const wl = list('worklogs', inR), adj = list('payments', r => r.type === 'adjust' && inR(r));
  const ex = list('expenses', inR), inc = list('incomes', inR);
  const expByCat = {}; ex.forEach(r => expByCat[r.cat || 'อื่นๆ'] = (expByCat[r.cat || 'อื่นๆ'] || 0) + num(r.amount));
  const incByCat = {}; inc.forEach(r => incByCat[r.cat || 'อื่นๆ'] = (incByCat[r.cat || 'อื่นๆ'] || 0) + num(r.amount));
  const o = {
    salesN: sales.length, kg: r2(sum(sales, 'weight')), dryKg: r2(sum(calc, x => x.c.dryKg)),
    gross: r2(sum(calc, x => x.c.gross)), deduct: r2(sum(sales, 'deduct')), net: r2(sum(calc, x => x.c.net)),
    tapper: r2(sum(calc, x => x.c.tapperTotal)), ownerNet: r2(sum(calc, x => x.c.ownerNet)),
    wages: r2(sum(wl, wageAmt)), adjust: r2(sum(adj, 'amount')), expenses: r2(sum(ex, 'amount')), other: r2(sum(inc, 'amount')),
    byProd, expByCat, incByCat,
    tapDays: new Set(list('tapping', r => inR(r) && r.rain !== 'skip').map(r => r.date)).size,
  };
  o.labor = r2(o.tapper + o.wages + o.adjust);
  o.income = r2(o.net + o.other);
  o.cost = r2(o.labor + o.expenses);
  o.profit = r2(o.income - o.cost);
  return o;
}

    const ld = +lastDay(ym).slice(8);
    const dt = `${ym}-${String(Math.min(day, ld)).padStart(2, '0')}`;

}

ROUTES.reports = {
  title: 'รายงาน',
  render(main) {
    const st = pstate('reports', () => ({ mode: 'month', ym: ymOf(today()) }));
    const draw = () => {
      const [a, b] = periodRange(st);
      const P = pnl(a, b);
      const areaAll = sum(list('plots', p => inFarm(p) && p.status !== 'young'), plotArea);
      const ownerIn = r2(P.ownerNet + P.other), ownCost = r2(P.wages + P.adjust + P.expenses);
      // trend
      let labels = [], periods = [];
      if (st.mode === 'year') { for (let m = 1; m <= 12; m++) { const ym = `${st.ym.slice(0, 4)}-${String(m).padStart(2, '0')}`; labels.push(TH_MON[m - 1]); periods.push([ym + '-01', lastDay(ym)]); } }
      else if (st.mode === 'month') { for (let i = 11; i >= 0; i--) { const ym = shiftYM(st.ym, -i); labels.push(thYMs(ym)); periods.push([ym + '-01', lastDay(ym)]); } }
      else { const ys = [...new Set([...list('sales'), ...list('expenses')].map(r => r.date.slice(0, 4)))].sort(); ys.forEach(y => { labels.push(String(+y + 543)); periods.push([y + '-01-01', y + '-12-31']); }); }
      const TP = periods.map(([x, y]) => pnl(x, y));
      // plots
      const plots = list('plots', inFarm).sort((x, y) => x.name.localeCompare(y.name, 'th'));
      const plotStats = plots.map(p => {
        const inP = r => r.plotId === p.id && r.date >= a && r.date <= b;
        const sales = list('sales', inP), sc = sales.map(saleCalc);
        return { p, area: plotArea(p), days: new Set(list('tapping', r => inP(r) && r.rain !== 'skip').map(r => r.date)).size, kg: sum(sales, 'weight'), dry: sum(sc, 'dryKg'), owner: sum(sc, 'ownerNet'), cost: sum(list('expenses', inP), 'amount') + sum(list('worklogs', inP), wageAmt) };
      });
      const noPlotKg = sum(list('sales', r => !r.plotId && r.date >= a && r.date <= b && inFarm(r)), 'weight');

        const L = workerLedger(w.id); const inR = x => x.date >= a && x.date <= b;
        return { w, days: new Set(list('tapping', r => (r.workerIds || []).includes(w.id) && r.rain !== 'skip' && inR(r)).map(r => r.date)).size, share: sum(L.rows.filter(x => x.kind === 'share' && inR(x)), 'amt'), wage: sum(L.rows.filter(x => (x.kind === 'wage' || x.kind === 'adjust') && inR(x)), 'amt'), paid: -sum(L.rows.filter(x => (x.kind === 'pay' || x.kind === 'advance') && inR(x)), 'amt'), bal: L.balance };

      main.innerHTML = `${periodNav(st)}
      <div class="card hero"><div class="small faint">กำไรสุทธิ ${periodLabel(st)}${curFarm !== 'all' ? ' · ' + esc(farmName(curFarm)) : ''}</div>
        <div style="font-size:30px;font-weight:700" class="tnum">${baht(P.profit)}</div>
        <div class="small faint">${areaAll ? `เฉลี่ย ${baht(P.profit / areaAll)} ต่อไร่ (พื้นที่กรีด ${fmt(areaAll, 1)} ไร่)` : ''}</div></div>
      <div class="card"><h3>${ic('receipt')} งบกำไรขาดทุน</h3><div class="tbl-wrap"><table class="tbl">
        <tr><td>ยอดขายยาง (${fmt(P.kg, 1)} กก.)</td><td class="n">${baht(P.gross)}</td></tr>
        ${P.deduct ? `<tr><td class="muted">&nbsp;&nbsp;หัก ค่าหัก/ค่าขนส่ง</td><td class="n neg">-${baht(P.deduct)}</td></tr>` : ''}
        <tr><td>รายรับอื่นๆ</td><td class="n">${baht(P.other)}</td></tr>
        <tr class="tot"><td>รวมรายรับ</td><td class="n">${baht(P.income)}</td></tr>
        <tr><td>ส่วนแบ่งคนกรีด</td><td class="n neg">-${baht(P.tapper)}</td></tr>
        <tr><td>ค่าแรงรายวัน</td><td class="n neg">-${baht(P.wages)}</td></tr>
        ${P.adjust ? `<tr><td>โบนัส/ปรับยอดคนงาน</td><td class="n neg">-${baht(P.adjust)}</td></tr>` : ''}
        ${Object.entries(P.expByCat).sort((x, y) => y[1] - x[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n neg">-${baht(v)}</td></tr>`).join('')}

        <tr class="tot"><td>กำไรสุทธิ</td><td class="n ${P.profit < 0 ? 'neg' : 'pos'}">${baht(P.profit)}</td></tr>
      </table></div>

/* ---------------- calendar ---------------- */
ROUTES.calendar = {
  title: 'ปฏิทิน',
  render(main) {
    const st = pstate('cal', () => ({ ym: ymOf(today()), sel: today() }));
    const draw = () => {
      const ym = st.ym, from = ym + '-01', to = lastDay(ym);
      const first = parseD(from).getDay();
      const gFrom = addDays(from, -first), gTo = addDays(gFrom, 41);
      const inR = r => r.date >= gFrom && r.date <= gTo && inFarm(r);
      const marks = {};
      const add = (d, c) => { (marks[d] = marks[d] || new Set()).add(c); };
      list('tapping', inR).forEach(r => add(r.date, r.rain === 'skip' ? '#9ca3af' : '#059669'));
      list('sales', inR).forEach(r => add(r.date, '#2563eb'));
      list('expenses', inR).forEach(r => add(r.date, '#dc2626'));
      list('activities', inR).forEach(r => add(r.date, '#7c3aed'));
      list('events', e => curFarm === 'all' || !e.plotId || inFarm(e)).forEach(e => eventOccurrences(e, gFrom, gTo).forEach(d => add(d, '#d97706')));
      const t = today();
      let cells = TH_DOW.map(d => `<div class="h">${d}</div>`).join('');
      for (let i = 0; i < 42; i++) {
        const d = addDays(gFrom, i);
        cells += `<div class="c${d.slice(0, 7) !== ym ? ' o' : ''}${d === t ? ' td' : ''}${d === st.sel ? ' sel' : ''}" data-d="${d}"><span>${+d.slice(8)}</span><span class="dots">${[...(marks[d] || [])].map(c => `<i style="background:${c}"></i>`).join('')}</span></div>`;
      }
      const sd = st.sel, onDay = r => r.date === sd && inFarm(r);
      const dayEvents = list('events', e => eventOccurrences(e, sd, sd).length && (curFarm === 'all' || !e.plotId || inFarm(e)));
      const dayList = [...dayEvents.map(ROWS.events), ...list('tapping', onDay).map(ROWS.tapping), ...list('sales', onDay).map(ROWS.sales), ...list('expenses', onDay).map(ROWS.expenses), ...list('worklogs', onDay).map(ROWS.worklogs), ...list('activities', onDay).map(ROWS.activities), ...list('health', onDay).map(ROWS.health)];
      const ev = list('events', e => eventOccurrences(e, from, to).length).sort((x, y) => eventOccurrences(x, from, to)[0].localeCompare(eventOccurrences(y, from, to)[0]));
      const m = +ym.slice(5) - 1;
      main.innerHTML = `<div class="mnav"><button data-cs="-1">${ic('left')}</button><div class="lbl">${thYM(ym)}</div><button data-cs="1">${ic('right')}</button></div>
        <div class="card" style="padding:10px"><div class="cal">${cells}</div>
        <div class="legend"><span><i style="background:#059669"></i>กรีด</span><span><i style="background:#9ca3af"></i>หยุดกรีด</span><span><i style="background:#2563eb"></i>ขาย</span><span><i style="background:#dc2626"></i>รายจ่าย</span><span><i style="background:#7c3aed"></i>งานดูแล</span><span><i style="background:#d97706"></i>นัดหมาย</span></div></div>
        <div class="alert info">${ic('info')}<div><b>${TH_MONTHS[m]}:</b> ${esc(MONTH_TIPS[m])}</div></div>
        <div class="sec-title">${thDateDow(sd)}<span class="sp"></span><button class="lk small" data-new="events" data-preset='${JSON.stringify({ date: sd })}'>+ นัดหมาย</button><button class="lk small" data-new="tapping" data-preset='${JSON.stringify({ date: sd })}'>+ กรีด</button></div>
        <div class="list">${dayList.length ? dayList.join('') : emptyBox('ไม่มีรายการในวันนี้', 'cal')}</div>
        <div class="sec-title">${ic('bell')} นัดหมายเดือนนี้</div>
        <div class="list">${ev.length ? ev.map(ROWS.events).join('') : emptyBox('ไม่มีนัดหมาย', 'bell')}</div>`;
      $$('[data-d]', main).forEach(c => c.onclick = () => { st.sel = c.dataset.d; if (st.sel.slice(0, 7) !== st.ym) st.ym = st.sel.slice(0, 7); draw(); });
      $$('[data-cs]', main).forEach(b => b.onclick = () => { st.ym = shiftYM(st.ym, +b.dataset.cs); st.sel = st.ym === ymOf(today()) ? today() : st.ym + '-01'; draw(); });
    };
    draw();
    setFab('นัดหมาย', () => openForm('events', null, { date: pstate('cal', () => ({})).sel }));
  }
};

/* ---------------- weather ---------------- */
ROUTES.weather = {
  title: 'สภาพอากาศ',
  render(main) {
    const draw = w => {
      if (!w) { main.innerHTML = `<div class="card">${weatherMini(null)}</div>`; return; }
      const D = w.data.daily, H = w.data.hourly, t = today();
      const nowH = `${t}T${nowTime().slice(0, 2)}:00`;
      const hi = H.time.map((x, i) => i).filter(i => H.time[i] >= nowH).slice(0, 24);
      main.innerHTML = `<div class="card hero">${weatherMini(w, true)}</div>
        <div class="card"><h3>${ic('drop')} ฝนรายชั่วโมง 24 ชม.ข้างหน้า (มม.)</h3>${barChart(hi.map(i => H.time[i].slice(11, 13) + 'น.'), [{ name: 'ปริมาณฝน', color: 'var(--blue)', values: hi.map(i => H.precipitation[i]) }], { h: 150, yfmt: v => fmt(v, 1) })}
          ${lineChart(hi.map(i => H.time[i].slice(11, 13) + 'น.'), [{ name: 'โอกาสฝน %', color: 'var(--amber)', values: hi.map(i => H.precipitation_probability?.[i] ?? null) }, { name: 'ความชื้น %', color: 'var(--pri2)', values: hi.map(i => H.relative_humidity_2m?.[i] ?? null) }], { h: 150, yfmt: v => fmt(v, 0), zero: true })}</div>
        <div class="sec-title">${ic('cal')} พยากรณ์รายวันและคำแนะนำการกรีด</div>
        <div class="list">${D.time.map((dt, i) => ({ dt, i })).filter(x => x.dt >= t).map(({ dt, i }) => { const a = tapAdvice(w.data, dt); return `<div class="item" style="cursor:default"><span class="ic ${a?.lvl === 'no' ? 'red' : a?.lvl === 'maybe' ? 'amber' : ''}" style="font-size:22px">${wxOf(D.weather_code[i])[0]}</span><span class="body"><span class="t">${dt === t ? 'วันนี้' : TH_DOW_L[parseD(dt).getDay()]} ${thDate(dt)}</span><span class="d">${wxOf(D.weather_code[i])[1]} · ฝน ${fmt(D.precipitation_sum[i], 1)} มม. (${fmt(D.precipitation_probability_max?.[i], 0)}%)</span><span class="d2">${a ? (a.lvl === 'ok' ? '✅ ' : a.lvl === 'maybe' ? '⚠️ ' : '⛔ ') + esc(a.text) : ''}</span></span><span class="r"><span class="a">${fmt(D.temperature_2m_max[i], 0)}°</span><span class="xs faint">${fmt(D.temperature_2m_min[i], 0)}°</span></span></div>`; }).join('')}</div>
        <div class="card small muted">${ic('info')} คำแนะนำการกรีดคำนวณจากปริมาณฝนช่วง 18:00 น. คืนก่อน ถึง 06:00 น. ของวันกรีด · ข้อมูลจาก Open-Meteo · ตำแหน่ง ${esc(w.name || '')} (${fmt(w.lat, 3)}, ${fmt(w.lon, 3)}) — ตั้งพิกัดได้ที่ข้อมูลสวน</div>`;
    };
    draw(META.weather);
    loadWeather(false).then(w => { if (route.name === 'weather') draw(w); }).catch(() => { if (!META.weather) main.innerHTML = `<div class="alert red">${ic('alert')}<div>โหลดสภาพอากาศไม่ได้ ตรวจสอบอินเทอร์เน็ต</div></div>`; });
  }
};

/* ---------------- CSV / backup ---------------- */
const csvCell = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function collCSV(coll) {
  const sch = SCHEMA[coll]; const fields = sch.fields.filter(f => f.t !== 'gps' && f.t !== 'photo');
  const rows = list(coll).sort((a, b) => (a.date || a.name || '').localeCompare(b.date || b.name || ''));
  const extra = { sales: [['ยอดขาย', r => saleCalc(r).gross], ['ยอดสุทธิ', r => saleCalc(r).net], ['ส่วนแบ่งคนกรีด', r => saleCalc(r).tapperTotal], ['เจ้าของได้', r => saleCalc(r).ownerNet]], worklogs: [['รวมค่าแรง', wageAmt]], items: [['คงเหลือ', r => itemStock(r.id)]], plots: [['พื้นที่ (ไร่)', r => r2(plotArea(r))]] }[coll] || [];
  const val = (f, r) => { const v = r[f.k]; if (f.t === 'ref') return f.coll === 'workers' ? workerName(v) : DB[f.coll].get(v)?.name || ''; if (f.t === 'mref') return (v || []).map(id => DB[f.coll].get(id)?.name || '').join(' / '); if (f.t === 'sel' || f.t === 'seg') { const o = fieldOpts(f, r).find(x => x[0] === v); return o ? o[1] : v; } if (f.t === 'chk') return v ? 'ใช่' : ''; return v ?? ''; };
  const head = [...fields.map(f => f.l), ...extra.map(e => e[0])];
  return '﻿' + [head, ...rows.map(r => [...fields.map(f => val(f, r)), ...extra.map(e => e[1](r))])].map(r => r.map(csvCell).join(',')).join('\r\n');
}
async function importBackup(file) {
  const text = await file.text(); let j;
  try { j = JSON.parse(text); } catch (e) { return toast('ไฟล์ไม่ถูกต้อง', 'err'); }
  if (!j || !j.data) return toast('ไม่ใช่ไฟล์สำรองของแอพนี้', 'err');
  if (!(await confirmBox('นำเข้าข้อมูลจากไฟล์สำรอง? ข้อมูลที่ใหม่กว่าจะถูกใช้แทน', 'นำเข้า', false))) return;
  let n = 0;
  for (const c of COLLS) {
    const puts = [];
    (j.data[c] || []).forEach(raw => { const r = coerce(c, raw); const loc = DB[c].get(r.id); if (!loc || r.updatedAt > num(loc.updatedAt)) { DB[c].set(r.id, r); puts.push(r); const d = META.dirty[c] || (META.dirty[c] = []); if (!d.includes(r.id)) d.push(r.id); n++; } });
    if (puts.length) await store.putRecs(c, puts);
  }
  await store.putMeta(); toast(`นำเข้า ${n} รายการ`, 'ok'); render(); scheduleSync();
}

  if (!(await confirmBox('เพิ่มข้อมูลตัวอย่าง 4 เดือนเพื่อทดลองใช้งาน? ลบออกได้ภายหลังที่หน้าตั้งค่า', 'เพิ่มตัวอย่าง', false))) return;
  const t = today(); const D = { demo: 1 };
  const put = async (c, r) => saveRec(c, { ...D, ...r });
  const farm = await put('farms', { name: 'สวนบ้านโนนสว่าง (ตัวอย่าง)', district: 'เมืองบึงกาฬ', province: 'บึงกาฬ', deed: 'โฉนด', lat: 18.3609, lon: 103.6464, owner: 'เจ้าของสวน' });
  const pA = await put('plots', { farmId: farm.id, name: 'แปลงหน้าบ้าน', rai: 12, ngan: 2, trees: 900, spacing: '3 x 7 ม.', plantYear: 2556, variety: 'RRIT 251', status: 'tapping', openDate: '2020-06-01', tapSystem: TAP_SYSTEMS[0], soil: 'ดินร่วนปนทราย' });
  const pB = await put('plots', { farmId: farm.id, name: 'แปลงห้วย', rai: 8, trees: 580, spacing: '3 x 7 ม.', plantYear: 2560, variety: 'RRIM 600', status: 'tapping', openDate: '2024-05-15', tapSystem: TAP_SYSTEMS[0], soil: 'ดินร่วน' });
  await put('plots', { farmId: farm.id, name: 'แปลงยางเล็ก', rai: 5, trees: 380, plantYear: 2565, variety: 'RRIT 251', status: 'young', soil: 'ดินร่วน' });
  const w1 = await put('workers', { name: 'สมชาย', phone: '0812345678', payType: 'share', ownerPct: 60, dailyWage: 350, plotIds: [pA.id], active: true });
  const w2 = await put('workers', { name: 'บุญมี', payType: 'share', ownerPct: 55, dailyWage: 350, plotIds: [pB.id], active: true });
  const w3 = await put('workers', { name: 'แดง', payType: 'daily', dailyWage: 350, active: true });
  const fert = await put('items', { name: 'ปุ๋ยสูตร 30-5-18', cat: 'ปุ๋ย', unit: 'กระสอบ', initQty: 2, minQty: 3 });
  const acid = await put('items', { name: 'กรดฟอร์มิก', cat: 'น้ำกรด', unit: 'ลิตร', initQty: 10, minQty: 5 });
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const start = addDays(t, -120);
  let price = 24;
  for (let i = 0; i <= 120; i++) {
    const d = addDays(start, i);
    price = r2(Math.min(32, Math.max(19, price + (rnd() - 0.48) * 0.8)));
    if (i % 2 === 0) await put('prices', { date: d, product: 'cuplump', price, source: 'ร้านรับซื้อในพื้นที่' });
    if (i % 7 === 0) await put('prices', { date: d, product: 'latex', price: r2(price * 2.4), source: 'กยท./ตลาดกลาง' });
    if (i % 2 === 0 && d < t) {
      const rain = rnd() < 0.18 ? 'skip' : rnd() < 0.1 ? 'after' : 'none';
      await put('tapping', { date: d, plotId: pA.id, workerIds: [w1.id], trees: rain === 'skip' ? 0 : 860, rain, product: 'cuplump', startTime: '02:30' });
      await put('tapping', { date: d, plotId: pB.id, workerIds: [w2.id], trees: rain === 'skip' ? 0 : 560, rain, product: 'cuplump', startTime: '03:00' });
    }
    if (i % 10 === 5 && d < t) {
      await put('sales', { date: d, product: 'cuplump', farmId: farm.id, plotId: pA.id, buyer: 'ร้านเจ๊หน่อย', weight: r2(190 + rnd() * 60), drc: 50, priceBasis: 'wet', price, deduct: 0, split: 'share', workerIds: [w1.id], ownerPct: 60, received: true });
      await put('sales', { date: d, product: 'cuplump', farmId: farm.id, plotId: pB.id, buyer: 'ร้านเจ๊หน่อย', weight: r2(115 + rnd() * 45), drc: 48, priceBasis: 'wet', price, deduct: 0, split: 'share', workerIds: [w2.id], ownerPct: 55, received: i < 110 });
    }
    if (i % 30 === 12 && d < t) { await put('payments', { date: d, workerId: w1.id, type: 'pay', amount: 6000, method: 'โอนเงิน/พร้อมเพย์' }); await put('payments', { date: d, workerId: w2.id, type: 'pay', amount: 3500, method: 'เงินสด' }); }
  }
  await put('payments', { date: addDays(t, -6), workerId: w1.id, type: 'advance', amount: 1500, method: 'เงินสด', note: 'เบิกค่าเทอมลูก' });
  await put('expenses', { date: addDays(t, -100), cat: 'ปุ๋ย', item: 'ปุ๋ยสูตร 30-5-18', farmId: farm.id, itemId: fert.id, qty: 20, unitPrice: 920, amount: 18400, vendor: 'ร้านเกษตรรุ่งเรือง' });
  await put('expenses', { date: addDays(t, -80), cat: 'กรดฟอร์มิก/น้ำกรด', item: 'กรดฟอร์มิก', farmId: farm.id, itemId: acid.id, qty: 20, unitPrice: 55, amount: 1100, vendor: 'ร้านเกษตรรุ่งเรือง' });
  await put('expenses', { date: addDays(t, -60), cat: 'อุปกรณ์กรีด (ถ้วย ลวด ราง มีด)', item: 'มีดกรีดยาง 2 เล่ม', farmId: farm.id, amount: 700 });
  await put('expenses', { date: addDays(t, -45), cat: 'ยากำจัดวัชพืช', item: 'ยาฆ่าหญ้า', farmId: farm.id, plotId: pB.id, amount: 1450 });
  await put('expenses', { date: addDays(t, -20), cat: 'ไฟฉาย/แบตเตอรี่', item: 'ไฟฉายคาดหัว', farmId: farm.id, amount: 890 });
  await put('expenses', { date: addDays(t, -3), cat: 'น้ำมันเชื้อเพลิง', item: 'น้ำมันรถขนยาง', farmId: farm.id, amount: 600 });
  await put('activities', { date: addDays(t, -98), type: 'ใส่ปุ๋ยเคมี', plotId: pA.id, detail: '30-5-18 ต้นละ 500 กรัม', itemId: fert.id, qty: 9, trees: 900, workerIds: [w3.id], nextDate: addDays(t, 5) });
  await put('activities', { date: addDays(t, -95), type: 'ใส่ปุ๋ยเคมี', plotId: pB.id, detail: '30-5-18 ต้นละ 500 กรัม', itemId: fert.id, qty: 6, trees: 580, workerIds: [w3.id] });
  await put('activities', { date: addDays(t, -44), type: 'ฉีดยาฆ่าหญ้า', plotId: pB.id, workerIds: [w3.id] });
  await put('stock', { date: addDays(t, -30), dir: 'out', itemId: acid.id, qty: 18, note: 'ใช้ทำยางก้อนถ้วย' });
  for (const [dd, days, task, pid] of [[-98, 2, 'ใส่ปุ๋ย', pA.id], [-95, 1.5, 'ใส่ปุ๋ย', pB.id], [-44, 1, 'ฉีดยาฆ่าหญ้า', pB.id], [-15, 2, 'ตัดหญ้า', pA.id]]) await put('worklogs', { date: addDays(t, dd), workerId: w3.id, task, plotId: pid, days, wage: 350 });
  await put('health', { date: addDays(t, -12), plotId: pA.id, issue: 'โรคเส้นดำ (หน้ากรีด)', severity: 'mid', trees: 14, status: 'treating', location: 'แถวที่ 3–5 ริมห้วย', symptom: 'มีเส้นดำเหนือรอยกรีด น้ำยางซึม', treatment: 'ทาสารป้องกันเชื้อราที่หน้ากรีด หยุดกรีดต้นที่เป็น', followDate: addDays(t, 2) });
  await put('incomes', { date: addDays(t, -70), cat: 'เงินช่วยเหลือ/ประกันรายได้ กยท.', amount: 3000, farmId: farm.id, note: 'ตัวอย่าง' });
  await put('events', { date: addDays(t, 3), title: 'ประชุมกลุ่มเกษตรกรชาวสวนยาง', type: 'meeting', time: '09:00', repeat: 'none' });
  await put('events', { date: `${t.slice(0, 4)}-04-30`, title: 'ชำระภาษีที่ดินและสิ่งปลูกสร้าง', type: 'money', repeat: 'yearly' });
  toast('เพิ่มข้อมูลตัวอย่างแล้ว', 'ok'); go('home');
}

async function init() {
  buildShell();
  $('#main').innerHTML = `<div class="empty">${LOGO.replace('class="logo"', 'style="width:56px;height:56px;color:var(--pri)"')}<div>กำลังโหลด...</div></div>`;
  await store.open();
  try { await store.loadAll(); } catch (e) { console.error(e); toast('โหลดข้อมูลในเครื่องไม่สำเร็จ', 'err'); }
  META.dirty = META.dirty || {}; META.settings = META.settings || {};
  if (EMBED.scriptUrl && !META.settings.scriptUrl) { META.settings.scriptUrl = EMBED.scriptUrl; META.settings.apiKey = EMBED.apiKey; }
  const hp = location.hash.match(/^#portal\?(.*)$/);
  if (hp) { const q = new URLSearchParams(hp[1]); if (q.get('u') && q.get('k')) { try { localStorage.setItem('rf_portal', JSON.stringify({ u: q.get('u'), k: q.get('k') })); localStorage.removeItem('rf_portal_cache'); } catch (e) { } } history.replaceState(null, '', location.pathname + location.search + '#portal'); }
  const hs = location.hash.match(/^#setup\?(.*)$/);
  if (hs) {
    const q = new URLSearchParams(hs[1]);
    if (q.get('u')) { META.settings.scriptUrl = q.get('u'); META.settings.apiKey = q.get('k') || ''; META.settings.autoSync = true; await store.putMeta(); setTimeout(() => toast('เชื่อมต่อ Google Sheets เรียบร้อย', 'ok'), 400); }
    history.replaceState(null, '', location.pathname + location.search + '#home');
  }
  applyTheme();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }); } catch (e) { }
  parseHash(); render();
  window.addEventListener('hashchange', () => { $$('.overlay').forEach(o => closeSheet(o, true)); parseHash(); render(); window.scrollTo(0, 0); });
  window.addEventListener('online', () => { updateSyncBtn(); sync(false); });
  window.addEventListener('offline', updateSyncBtn);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(false); if (route.name === 'home') loadWeather().then(w => { const el = $('#wxMini'); if (el && w) el.innerHTML = weatherMini(w, true); }).catch(() => { }); } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  setInterval(() => { if (!document.hidden) sync(false); }, 5 * 60e3);
  if (S().scriptUrl) sync(false);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => { const nw = reg.installing; nw?.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('มีเวอร์ชันใหม่ ปิดแล้วเปิดแอพใหม่เพื่ออัปเดต'); }); });
    }).catch(() => { });
  }
}

const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------------- batch tapping ---------------- */
ROUTES.tapday = {
  title: 'บันทึกกรีดหลายแปลง',
  render(main) {
    const st = pstate('tapday', () => ({ date: today(), rain: 'none', rows: null }));
    const plots = list('plots', p => inFarm(p) && p.status !== 'young' && p.status !== 'replant').sort((a, b) => a.name.localeCompare(b.name, 'th'));
    if (!plots.length) { main.innerHTML = `<div class="list">${emptyBox('ยังไม่มีแปลงที่เปิดกรีด')}</div><button class="btn block" data-go="plots">${ic('leaf')} ไปที่แปลงยาง</button>`; return; }
    const done = new Set(list('tapping', r => r.date === st.date).map(r => r.plotId));
    const initRow = p => {
      const last = list('tapping', r => r.plotId === p.id && r.date <= st.date).sort(byDateDesc)[0];
      const assigned = activeWorkers().filter(w => (w.plotIds || []).includes(p.id)).map(w => w.id);
      const due = typeof tapDue === 'function' ? tapDue(p, st.date) : { due: true };
      return { plotId: p.id, due, on: !done.has(p.id) && (due.due || due.noSystem), workerIds: last?.workerIds?.filter(id => get('workers', id)) || assigned, trees: last && num(last.trees) ? num(last.trees) : num(p.trees) || '', product: last?.product || 'cuplump', qty: '', startTime: last?.startTime || '' };
    };
    if (!st.rows || st.rowsDate !== st.date) { st.rows = plots.map(initRow); st.rowsDate = st.date; }
    const ws = activeWorkers();
    const draw = () => {
      const n = st.rows.filter(r => r.on).length;
      main.innerHTML = `
      <div class="card"><div class="fields">
        <div class="field half"><label class="fl">วันที่</label><input class="inp" type="date" id="tdDate" value="${st.date}"></div>
        <div class="field half"><label class="fl">สภาพอากาศ (ทุกแปลง)</label><select class="inp" id="tdRain">${Object.entries(RAIN).map(([k, l]) => `<option value="${k}"${st.rain === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="row wrap" style="margin-top:10px"><button class="btn sm" id="tdAll">เลือกทุกแปลง</button><button class="btn sm" id="tdNone">ไม่เลือก</button><button class="btn sm danger" id="tdRainAll">🌧️ วันนี้ฝนตก หยุดกรีดทุกแปลง</button></div></div>
      ${st.rows.map((r, i) => { const p = get('plots', r.plotId); return `
      <div class="card" data-i="${i}" style="${r.on ? '' : 'opacity:.6'}">
        <label class="switch" style="padding:0 0 6px"><input type="checkbox" data-f="on"${r.on ? ' checked' : ''}> <b>${esc(p.name)}</b> ${done.has(p.id) ? '<span class="badge">บันทึกแล้ววันนี้</span>' : r.due && !r.due.noSystem ? `<span class="badge ${r.due.due ? '' : 'gray'}">${r.due.due ? 'ถึงรอบ' : r.due.inRest ? 'พักผลัดใบ' : 'พักตามระบบ'}</span>` : ''}<span class="sp"></span><span class="xs faint">${fmt(p.trees)} ต้น</span></label>
        ${r.on ? `<div class="mchips" style="margin-bottom:8px">${ws.map(w => `<label><input type="checkbox" data-w="${w.id}"${r.workerIds.includes(w.id) ? ' checked' : ''}>${esc(w.name)}</label>`).join('') || '<span class="hint">ยังไม่มีคนงาน</span>'}</div>
        <div class="fields">
          <div class="field third"><label class="fl">ต้นที่กรีด</label><input class="inp" type="number" inputmode="numeric" data-f="trees" value="${esc(r.trees)}"></div>
          <div class="field third"><label class="fl">น้ำหนัก (กก.)</label><input class="inp" type="number" inputmode="decimal" step="any" data-f="qty" value="${esc(r.qty)}" placeholder="ถ้าชั่ง"></div>
          <div class="field third"><label class="fl">ผลผลิต</label><select class="inp" data-f="product">${[['cuplump', 'ก้อนถ้วย'], ['latex', 'น้ำยางสด'], ['usss', 'ยางแผ่น']].map(([k, l]) => `<option value="${k}"${r.product === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
        </div>` : ''}
      </div>`; }).join('')}
      <button class="btn pri block" id="tdSave" style="min-height:52px;font-size:16px" ${n ? '' : 'disabled'}>${ic('check')} บันทึก ${n} แปลง${st.rain === 'skip' ? ' (หยุดกรีด)' : ''}</button>`;
      $('#tdDate', main).onchange = e => { st.date = e.target.value || today(); render(); };
      $('#tdRain', main).onchange = e => { st.rain = e.target.value; draw(); };
      $('#tdAll', main).onclick = () => { st.rows.forEach(r => r.on = true); draw(); };
      $('#tdNone', main).onclick = () => { st.rows.forEach(r => r.on = false); draw(); };
      $('#tdRainAll', main).onclick = () => { st.rain = 'skip'; st.rows.forEach(r => r.on = !done.has(r.plotId)); draw(); };
      $$('[data-i]', main).forEach(card => {
        const r = st.rows[+card.dataset.i];
        card.addEventListener('change', e => {
          const t = e.target;
          if (t.dataset.f === 'on') { r.on = t.checked; draw(); return; }
          if (t.dataset.w) { r.workerIds = $$('[data-w]:checked', card).map(x => x.dataset.w); return; }
          if (t.dataset.f) r[t.dataset.f] = t.type === 'number' ? (t.value === '' ? '' : num(t.value)) : t.value;
        });
        card.addEventListener('input', e => { const t = e.target; if (t.dataset.f && t.type === 'number') r[t.dataset.f] = t.value === '' ? '' : num(t.value); });
      });
      $('#tdSave', main).onclick = async () => {
        const rows = st.rows.filter(r => r.on);
        if (!rows.length) return;
        try {
          for (const r of rows) await saveRec('tapping', { date: st.date, plotId: r.plotId, workerIds: r.workerIds, trees: st.rain === 'skip' ? 0 : r.trees, qty: st.rain === 'skip' ? '' : r.qty, product: r.product, rain: st.rain, startTime: r.startTime });
        } catch (e) { return; }
        toast(`บันทึก ${rows.length} แปลงแล้ว`, 'ok');
        st.rows = null; go('tapping');
      };
    };
    draw();
  }
};

/* ---------------- deep reports ---------------- */
function plotYields(year) {
  const a = `${year}-01-01`, b = `${year}-12-31`;
  const plots = list('plots', p => inFarm(p) && p.status !== 'young');
  const res = Object.fromEntries(plots.map(p => [p.id, { p, area: plotArea(p), dry: 0, kg: 0, alloc: 0, taps: 0 }]));
  list('tapping', r => r.date >= a && r.date <= b && r.rain !== 'skip' && res[r.plotId]).forEach(r => res[r.plotId].taps += num(r.trees) || num(res[r.plotId].p.trees));
  list('sales', s => s.date >= a && s.date <= b && inFarm(s)).forEach(s => {
    const dry = estDryKg(s);
    if (s.plotId && res[s.plotId]) { res[s.plotId].dry += dry; res[s.plotId].kg += num(s.weight); return; }
    const farm = s.farmId || '';
    const cands = Object.values(res).filter(x => !farm || x.p.farmId === farm);
    const wsum = sum(cands, x => x.taps) || sum(cands, x => x.area);
    cands.forEach(x => { const w = (sum(cands, y => y.taps) ? x.taps : x.area) / (wsum || 1); x.dry += dry * w; x.kg += num(s.weight) * w; x.alloc += dry * w; });
  });
  return Object.values(res).sort((x, y) => x.p.name.localeCompare(y.p.name, 'th'));
}

/* ---------------- Thai numbers & text parsing ---------------- */
const TH_DIGITS = { 'ศูนย์': 0, 'หนึ่ง': 1, 'เอ็ด': 1, 'สอง': 2, 'ยี่': 2, 'สาม': 3, 'สี่': 4, 'ห้า': 5, 'หก': 6, 'เจ็ด': 7, 'แปด': 8, 'เก้า': 9 };
const TH_UNITS = { 'สิบ': 10, 'ร้อย': 100, 'พัน': 1000, 'หมื่น': 1e4, 'แสน': 1e5, 'ล้าน': 1e6 };
const TH_NUM_RE = /(?:ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน|จุด)+/g;
function thaiWordsValue(s) {
  const toks = s.match(/ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน|จุด/g) || [];
  let total = 0, cur = 0, dec = null;
  for (const t of toks) {
    if (dec !== null) { if (t in TH_DIGITS) dec += String(TH_DIGITS[t]); continue; }
    if (t === 'จุด') { dec = ''; continue; }
    if (t in TH_DIGITS) { cur = cur && cur < 10 ? cur * 10 + TH_DIGITS[t] : TH_DIGITS[t]; continue; }
    const u = TH_UNITS[t];
    if (u === 1e6) { total = (total + cur) * 1e6; cur = 0; }
    else { total += (cur || 1) * u; cur = 0; }
  }
  const v = total + cur;
  return dec ? parseFloat(v + '.' + dec) : v;
}
function normalizeThaiText(text) {
  let s = String(text || '').replace(/\u0e4d\u0e32/g, 'ำ').replace(/[๐-๙]/g, c => '๐๑๒๓๔๕๖๗๘๙'.indexOf(c)).replace(/(\d),(\d{3})/g, '$1$2');
  s = s.replace(TH_NUM_RE, (m, off, str) => {
    const next = str[off + m.length] || '';
    if (/^(?:ร้อย|พัน|หมื่น|แสน|ล้าน)/.test(m) && off > 0 && /[ก-๛]/.test(str[off - 1])) return m; // เรียบร้อย
    if (/^พัน/.test(m) && next === 'ธ') return m; // พันธุ์
    if (m === 'จุด') return m;

  });

function parseScaleText(text) {
  const lines = String(text || '').split(/\n+/).map(x => normalizeThaiText(x)).filter(Boolean);
  const nums = l => (l.match(/\d+(?:\.\d+)?/g) || []).map(Number);
  const out = { weight: null, price: null, drc: null, amount: null };
  let wPri = 0, gross = null, tare = null;
  lines.forEach((l, i) => {
    const ns = nums(l).filter(x => x > 0); const nx = nums(lines[i + 1] || '').filter(x => x > 0);
    const pick = arr => arr.length ? arr[arr.length - 1] : null;
    const val = ns.length ? pick(ns) : pick(nx);
    if (val === null) return;
    if (/(drc|ดีอาร์ซี|เนื้อยาง|เปอร์เซ็น|%)/i.test(l)) { const v = [...ns, ...nx].find(x => x >= 10 && x <= 100); if (v && !out.drc) out.drc = v; return; }
    if (/(ราคา|บาท\s*\/\s*กก|บ\.?\s*\/\s*กก|price|@)/i.test(l) && !/(รวม|จำนวนเงิน|เป็นเงิน)/.test(l)) { const v = [...ns, ...nx].find(x => x >= 5 && x <= 500); if (v && !out.price) out.price = v; return; }

    if (/(ชั่งเข้า|ขาเข้า|รวมรถ|gross)/i.test(l)) { gross = val; return; }
    if (/(ชั่งออก|ขาออก|น้ำหนักรถ|tare)/i.test(l)) { tare = val; return; }
    let pri = 0;
    if (/(สุทธิ|net)/i.test(l) && !/บาท/.test(l)) pri = 3;
    else if (/(น้ำหนัก|นน\.?|weight|กก\.?|kg|กิโล)/i.test(l) && !/(บาท|ราคา)/.test(l)) pri = 2;

}

const REST_DEFAULT = [2, 3, 4];
const restMonths = () => { const v = S().restMonths; return Array.isArray(v) ? v : REST_DEFAULT; };
function tapSysCode(p) { const s = String(p.tapSystem || ''); if (/2d3/.test(s)) return '2d3'; const m = s.match(/\bd([1-4])\b/); return m ? 'd' + m[1] : ''; }
function tapDue(p, date = today()) {
  if (p.status === 'young' || p.status === 'replant') return { due: false, off: true, why: PLOT_STATUS[p.status] };
  if (p.status === 'rest') return { due: false, off: true, why: 'พักกรีด' };
  const inRest = restMonths().includes(+date.slice(5, 7));
  const dates = new Set(list('tapping', r => r.plotId === p.id && r.rain !== 'skip' && r.date < date).map(r => r.date));
  const last = [...dates].sort().pop() || '';
  const code = tapSysCode(p);
  let due = true, why = '';
  if (code === '2d3') { if (dates.has(addDays(date, -1)) && dates.has(addDays(date, -2))) { due = false; why = 'กรีดติดกัน 2 วันแล้ว วันนี้พัก (2d3)'; } else why = 'ถึงรอบกรีด (2d3)'; }
  else if (code && code !== 'd1') { const n = +code.slice(1); if (last && diffDays(last, date) < n) { due = false; why = `กรีดล่าสุด${last === addDays(date, -1) ? 'เมื่อวาน' : ' ' + thDate(last)} · ระบบ ${code} กรีดได้อีก ${thDate(addDays(last, n))}`; } else why = `ถึงรอบกรีด (${code})`; }
  else if (code === 'd1') why = 'กรีดทุกวัน';
  else why = last ? `กรีดล่าสุด ${thDate(last)}` : 'ยังไม่มีบันทึกกรีด';
  if (inRest && due) why = 'ช่วงพักผลัดใบ ควรงดกรีด';
  return { due: due && !inRest, inRest, why, last, code, noSystem: !code };
}

/* ---------------- plot boundary by GPS ---------------- */
const polyOf = p => { const a = safeJSON(p?.poly, []); return Array.isArray(a) ? a.filter(x => Array.isArray(x) && x.length >= 2 && isFinite(x[0]) && isFinite(x[1])) : []; };
function polyMetrics(pts) {
  if (pts.length < 2) return { m2: 0, perim: 0 };
  const lat0 = pts.reduce((s, p) => s + p[0], 0) / pts.length, lon0 = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110574;
  const xy = pts.map(([la, lo]) => [(lo - lon0) * kx, (la - lat0) * ky]);
  let a = 0, per = 0;
  xy.forEach((p, i) => { const q = xy[(i + 1) % xy.length]; a += p[0] * q[1] - q[0] * p[1]; if (i < xy.length - 1 || xy.length > 2) per += Math.hypot(q[0] - p[0], q[1] - p[1]); });
  return { m2: pts.length >= 3 ? Math.abs(a) / 2 : 0, perim: per, center: [lat0, lon0], xy };
}
const m2ToRai = m2 => { const rai = Math.floor(m2 / 1600); const ngan = Math.floor((m2 - rai * 1600) / 400); const wa = r2((m2 - rai * 1600 - ngan * 400) / 4); return { rai, ngan, wa }; };
const raiText = m2 => { const x = m2ToRai(m2); return `${x.rai} ไร่ ${x.ngan} งาน ${fmt(x.wa, 1)} ตร.วา`; };
const gpsDist = (a, b) => polyMetrics([a, b]).perim;
function polySvg(pts, size = 280, live) {
  if (!pts.length) return `<div class="empty" style="height:${size * 0.6}px">${ic('map')}<div>ยังไม่มีจุด</div></div>`;
  const { xy } = polyMetrics(pts.length === 1 ? [pts[0], pts[0]] : pts);
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const w = Math.max(...xs) - Math.min(...xs) || 1, h = Math.max(...ys) - Math.min(...ys) || 1;
  const sc = (size - 30) / Math.max(w, h); const ox = Math.min(...xs), oy = Math.max(...ys);
  const P = xy.map(([x, y]) => [15 + (x - ox) * sc, 15 + (oy - y) * sc]);
  const H = 30 + h * sc;
  return `<svg viewBox="0 0 ${size} ${H}" style="width:100%;max-width:${size}px;display:block;margin:0 auto;background:var(--pri-soft);border-radius:12px">
    ${P.length >= 3 ? `<polygon points="${P.map(p => p.join(',')).join(' ')}" fill="rgba(4,120,87,.25)" stroke="var(--pri)" stroke-width="2"/>` : `<polyline points="${P.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--pri)" stroke-width="2"/>`}
    ${P.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === P.length - 1 && live ? 6 : 4}" fill="${i === P.length - 1 && live ? 'var(--red)' : 'var(--pri)'}"/>`).join('')}
    <text x="${size - 8}" y="16" text-anchor="end" font-size="11" fill="var(--muted)">▲ เหนือ · ${fmt(Math.max(w, h), 0)} ม.</text></svg>`;
}
function kmlFor(plots) {

function fertPlan(p, replantArea) {
  const age = plotAge(p); const sandy = /ทราย/.test(p.soil || '');
  const young = p.status === 'young' || (age !== null && age < 7 && p.status !== 'tapping');
  if (!young) return { stage: 'เปิดกรีด', formula: '30-5-18 (หรือ 29-5-18)', g: 500, times: 2 };
  const months = age === null ? 24 : Math.max(1, age * 12);
  const g = months <= 17 ? 90 : months <= 41 ? 190 : 250;
  return { stage: `ยางเล็ก ${age ?? '?'} ปี`, formula: replantArea ? '20-8-20' : sandy ? '20-10-17' : '20-10-12', g, times: 2 };
}

async function loadRainHistory(force) {
  const L = weatherLoc(); const end = addDays(today(), -6); const start = shiftYM(ymOf(end), -11) + '-01';
  const key = `${L.lat},${L.lon},${start}`; const c = META.rainHist;
  if (!force && c && c.key === key && Date.now() - c.at < 3 * 864e5) return c;
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${L.lat}&longitude=${L.lon}&start_date=${start}&end_date=${end}&daily=precipitation_sum&timezone=Asia%2FBangkok`;
  const data = await fetch(url).then(r => r.json());
  if (!data.daily || !data.daily.time) throw new Error(data.reason || 'ไม่มีข้อมูล');
  const months = {};
  data.daily.time.forEach((d, i) => { const ym = d.slice(0, 7); const v = num(data.daily.precipitation_sum[i]); const m = months[ym] || (months[ym] = { mm: 0, rainy: 0, days: 0 }); m.mm += v; m.days++; if (v >= 1) m.rainy++; });
  META.rainHist = { key, at: Date.now(), name: L.name, months, end };
  await store.putMeta(); return META.rainHist;
}

    <div class="hint">ข้อมูลฝนย้อนหลังจาก Open-Meteo (แบบจำลองสภาพอากาศ ณ พิกัด ${esc(h.name)}) ถึง ${thDate(h.end)} · วันฝนตก = ฝน ≥ 1 มม.</div>`;

const SEASON_W = [0.09, 0.03, 0.01, 0.02, 0.06, 0.08, 0.09, 0.09, 0.10, 0.12, 0.15, 0.16];
function forecastCompute(opt = {}) {
  const t = today(); const ym0 = ymOf(t);
  const priceAdj = 1 + num(opt.price) / 100, yieldAdj = 1 + num(opt.yield) / 100, costAdj = 1 + num(opt.cost) / 100;
  const salesIn = (a, b) => list('sales', s => s.date >= a && s.date <= b && inFarm(s));
  const monthDry = ym => sum(salesIn(ym + '-01', lastDay(ym)), estDryKg);
  // recent price per dry kg and owner share
  const rec = salesIn(addDays(t, -120), t); const recDry = sum(rec, estDryKg); const recNet = sum(rec, s => saleCalc(s).net); const recOwner = sum(rec, s => saleCalc(s).ownerNet);
  let pDry = recDry ? recNet / recDry : 0; let ownerRatio = recNet ? recOwner / recNet : 0;
  if (!pDry) { const lp = list('prices', r => r.product === 'cuplump').sort(byDateDesc)[0]; pDry = lp ? num(lp.price) * 100 / (num(S().cupDrc) || 50) : 0; }
  if (!ownerRatio) ownerRatio = list('workers', w => w.payType === 'share' && w.active !== false).length ? num(S().ownerPct) / 100 : 1;
  const tappingArea = sum(list('plots', p => inFarm(p) && p.status === 'tapping'), plotArea);
  const annualRef = tappingArea * (num(S().refYield) || 250);
  // trend: last 3 full months vs same months a year before
  let a = 0, b = 0; for (let i = 1; i <= 3; i++) { const m = shiftYM(ym0, -i); a += monthDry(m); b += monthDry(shiftYM(m, -12)); }
  const trend = a && b ? Math.min(1.4, Math.max(0.6, a / b)) : 1;
  const costOf = ym => { const P = pnl(ym + '-01', lastDay(ym)); return P.wages + P.adjust + P.expenses; };
  const last6cost = [1, 2, 3, 4, 5, 6].map(i => costOf(shiftYM(ym0, -i)));
  const avgCost = sum(last6cost, x => x) / 6;
  const rest = restMonths();
  const months = [];
  let cash = num(opt.cash);
  for (let i = 0; i < 12; i++) {
    const ym = shiftYM(ym0, i); const mi = +ym.slice(5, 7) - 1; const ly = shiftYM(ym, -12);
    let dry, src;
    const lyDry = monthDry(ly);
    if (lyDry) { dry = lyDry * trend; src = 'ปีก่อน'; } else { dry = annualRef * SEASON_W[mi]; src = 'ค่าอ้างอิง'; }
    if (rest.includes(mi + 1) && !lyDry) dry *= 0.3;
    dry *= yieldAdj;
    if (i === 0) { const done = monthDry(ym); const frac = (+t.slice(8, 10)) / +lastDay(ym).slice(8, 10); dry = Math.max(done, done + dry * (1 - frac)); }
    const income = dry * pDry * priceAdj * ownerRatio;
    const lyCost = costOf(ly); const cost = (lyCost || avgCost) * costAdj;
    const net = income - cost; cash += net;
    months.push({ ym, dry, income, cost, net, cash, src });
  }
  const minCash = Math.min(...months.map(m => m.cash));
  const minM = months.find(m => m.cash === minCash);
  return { months, pDry, ownerRatio, trend, annualRef, minCash, minM, totalNet: sum(months, 'net'), totalIncome: sum(months, 'income') };
}

function mdLite(s) {
  const lines = esc(String(s || '').replace(/```json[\s\S]*?```/g, '').trim()).split('\n');
  let html = '', inList = false;
  lines.forEach(raw => {
    let l = raw.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<i>$2</i>');
    const li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${li[1]}</li>`; return; }
    if (inList) { html += '</ul>'; inList = false; }
    const h = l.match(/^#{1,4}\s+(.*)$/);
    if (h) html += `<div class="ai-h">${h[1]}</div>`; else if (l.trim()) html += `<p>${l}</p>`;
  });
  if (inList) html += '</ul>';
  return html;
}

function countUp(el) {
  const txt = el.textContent; const m = txt.match(/-?[\d,]+(?:\.\d+)?/);
  if (!m || !motionOn()) return;
  const target = num(m[0]); if (!isFinite(target) || Math.abs(target) < 10) return;
  const dec = (m[0].split('.')[1] || '').length; const t0 = performance.now(); const dur = 650;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - k, 3);
    el.textContent = txt.replace(m[0], (target * e).toLocaleString('th-TH', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
    if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
  };
  requestAnimationFrame(step);
}

{

    return svg.replace('<svg class="chart"', '<svg class="chart grow"');
  };
  const origLine = lineChart;
  lineChart = function (labels, series, opt = {}) {
    let svg = origLine(labels, series, opt);
    if (series.length !== 1 || !svg.includes('<path')) return svg;
    const m = svg.match(/<path d="(M[^"]+)" fill="none" stroke="([^"]+)"/);
    const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
    if (!m || !vb) return svg;
    const H = +vb[2] - 22;
    const area = `<defs><linearGradient id="la" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${m[2]}" stop-opacity=".28"/><stop offset="100%" stop-color="${m[2]}" stop-opacity="0"/></linearGradient></defs>`;
    const first = m[1].match(/M([\d.]+),/), last = [...m[1].matchAll(/[ML]([\d.]+),([\d.]+)/g)].pop();
    if (!first || !last) return svg;
    const path = `<path d="${m[1]}L${last[1]},${H}L${first[1]},${H}Z" fill="url(#la)" stroke="none"/>`;
    return svg.replace('role="img">', `role="img">${area}${path}`);
  };

function donut(entries, { size = 168, thick = 26, fmtV = baht } = {}) {
  const tot = sum(entries, e => Math.abs(num(e[1])));
  if (!tot) return emptyBox('ไม่มีข้อมูล', 'chart');
  const COLORS = ['var(--pri)', 'var(--blue)', 'var(--amber)', 'var(--violet)', 'var(--red)', 'var(--pri2)', '#0891b2', '#db2777'];
  const R = size / 2, r = R - thick / 2, C = 2 * Math.PI * r;
  let off = 0;
  const arcs = entries.slice(0, 8).map(([l, v], i) => {
    const frac = Math.abs(num(v)) / tot; const dash = `${(frac * C).toFixed(2)} ${(C - frac * C).toFixed(2)}`;
    const el = `<circle cx="${R}" cy="${R}" r="${r}" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="${thick}" stroke-dasharray="${dash}" stroke-dashoffset="${(-off * C).toFixed(2)}" transform="rotate(-90 ${R} ${R})"><title>${esc(l)}: ${fmtV(v)} (${fmt(frac * 100, 0)}%)</title></circle>`;
    off += frac; return el;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 ${size} ${size}" class="donut" width="${size}" height="${size}">${arcs}<text x="${R}" y="${R - 2}" text-anchor="middle" class="dt">${fmtV(tot)}</text><text x="${R}" y="${R + 16}" text-anchor="middle" class="ds">รวม</text></svg>
    <div class="donut-legend">${entries.slice(0, 8).map(([l, v], i) => `<div class="row"><i style="background:${COLORS[i % COLORS.length]}"></i><span class="sp">${esc(l)}</span><b>${fmtV(v)}</b><span class="xs faint" style="width:38px;text-align:right">${fmt(Math.abs(num(v)) / tot * 100, 0)}%</span></div>`).join('')}</div></div>`;
}
